<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="description" content="Tổng hợp học sinh hiện tại theo đơn vị tuyển sinh, phân hiệu nhập học và doanh nghiệp." />
  <title>TH Kết quả nhập học năm 2026 | CĐ TKV</title>
  <link rel="stylesheet" href="./styles.css?v=20260826-unique-1" />
  <style>
    .report-header h1{font-size:23px;line-height:1.2;margin:8px 0}
    .report-header p{font-size:14px;line-height:1.4}
    .report-tabs{display:flex;gap:7px;padding:7px;background:#f1f5f9;border:1px solid #d7e0ea;border-radius:10px;overflow-x:auto}
    .tab-btn{font-size:13.5px;font-weight:750;line-height:1.2;padding:10px 14px;background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:8px;white-space:nowrap;cursor:pointer}
    .tab-btn:hover{background:#eaf2f8;color:#0f4c81;border-color:#9fb7cc}
    .tab-btn.active{background:#0f4c81;color:#fff;border-color:#0f4c81;box-shadow:0 2px 6px rgba(15,76,129,.22)}
    .dashboard-title h2{font-size:21px;line-height:1.2}
    .dashboard-title p{font-size:13.5px}
    .snapshot-summary{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:8px;margin:10px 0 14px}
    .snapshot-summary>div{background:#f8fafc;border:1px solid #dbe3ec;border-radius:9px;padding:10px 12px}
    .snapshot-summary span{display:block;font-size:12.5px;color:#64748b;margin-bottom:4px}
    .snapshot-summary strong{font-size:20px;color:#0f172a}
    .snapshot-summary .current-total{background:#eef6ff;border-color:#9fc4e8}
    .snapshot-summary .current-total strong{font-size:23px;color:#0f4c81}
    .pos{color:#15803d!important;font-weight:800!important}
    .neg{color:#b91c1c!important;font-weight:800!important}
    .native-table-wrap{overflow-x:auto}
    .snapshot-table{min-width:780px!important;font-size:14px!important}
    .snapshot-table th,.snapshot-table td{font-size:14px!important;line-height:1.25!important;padding:8px 9px!important;height:38px!important}
    .snapshot-table th{font-weight:800!important;text-align:center!important}
    .snapshot-table td:nth-child(1),.snapshot-table td:nth-child(2),.snapshot-table td:nth-child(4),.snapshot-table td:nth-child(5),.snapshot-table td:nth-child(6){text-align:center}
    .snapshot-table .name-cell{font-weight:700;white-space:nowrap;min-width:260px}
    .snapshot-table .code-cell{font-weight:700;color:#475569;white-space:nowrap}
    .snapshot-table .current-cell{font-weight:800;color:#0f4c81}
    .snapshot-table .summary-row td{font-size:15px!important;font-weight:850!important;background:#eaf2f8!important}
    .source-note{font-size:13.5px;line-height:1.48;margin-top:13px}
    @media(max-width:900px){
      .report-header h1{font-size:20px}
      .snapshot-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
      .snapshot-summary .current-total{grid-column:1/-1}
      .snapshot-table{min-width:720px!important}
      .snapshot-table th,.snapshot-table td{font-size:14px!important;padding:8px 6px!important}
      .snapshot-table .name-cell{min-width:230px}
    }
  </style>
</head>
<body>
  <main class="sheet-page">
    <header class="report-header">
      <div class="agency-block">
        <div>TRƯỜNG CAO ĐẲNG THAN - KHOÁNG SẢN VIỆT NAM</div>
        <strong>TRUNG TÂM TUYỂN SINH - GIỚI THIỆU VIỆC LÀM</strong>
      </div>
      <h1>TỔNG HỢP KẾT QUẢ NHẬP HỌC HIỆN TẠI</h1>
      <p>Khóa biểu tổng hợp và DSHS ngày 31/07/2026 làm gốc · Sau 31/07 chỉ tính chênh lệch học sinh duy nhất trong DSHS hiện tại</p>
    </header>
    <nav class="report-tabs" aria-label="Chọn biểu tổng hợp">
      <button class="tab-btn active" data-report="dv">1. THEO ĐƠN VỊ TUYỂN SINH</button>
      <button class="tab-btn" data-report="ph">2. THEO PHÂN HIỆU NHẬP HỌC</button>
      <button class="tab-btn" data-report="dn">3. THEO DOANH NGHIỆP</button>
    </nav>
    <section class="report-sheet" id="reportContent" aria-live="polite">
      <div class="loading-cell">Đang tải số liệu hiện tại…</div>
    </section>
  </main>
  <script src="./report-loader.js?v=20260826-unique-1"></script>
  <script src="./app.js?v=20260826-unique-1"></script>
</body>
</html>
