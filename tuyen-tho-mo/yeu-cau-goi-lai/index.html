<body><main class="callback"><a href="/">Về trang chủ</a><h1>Để lại số để được gọi lại</h1><p>Chỉ cần thông tin liên hệ và nghề anh quan tâm. Chưa cần ngày sinh, thông tin sức khỏe hay giấy tờ.</p>
<noscript>Trình duyệt cần JavaScript để gửi. Anh vẫn có thể liên hệ qua Zalo hoặc gọi điện ở bên dưới.</noscript>
<form data-callback-form><label>Họ và tên<input name="full_name" required minlength="2" maxlength="80" autocomplete="name"></label><label>Số điện thoại<input name="phone" required type="tel" inputmode="tel" autocomplete="tel" maxlength="20"></label><label>Tỉnh/thành đang sống<input name="province" required minlength="2" maxlength="40" autocomplete="address-level1"></label><label>Nghề quan tâm<select name="trade" required><option>Cần tư vấn chọn nghề</option><option>Kỹ thuật khai thác mỏ hầm lò</option><option>Kỹ thuật xây dựng mỏ hầm lò</option><option>Kỹ thuật cơ điện mỏ hầm lò</option></select></label><label class="consent"><input type="checkbox" name="consent" required> Tôi đồng ý để bộ phận tuyển sinh dùng thông tin này gọi lại tư vấn.</label><button disabled type="submit">Gửi yêu cầu gọi lại</button></form>
