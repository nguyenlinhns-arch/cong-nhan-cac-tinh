name: Verify Fanpage media deployment v2

on:
  push:
    branches:
      - main
    paths:
      - '.verify-fanpage-media-v2-trigger'
      - '.github/workflows/verify-fanpage-media-v2.yml'

permissions:
  contents: write

concurrency:
  group: verify-fanpage-media-deployment
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'verify-fanpage-media-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish verification run marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_RUNNING.md <<EOF
          # Fanpage media verification running

          - Status: RUNNING
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Started at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_RUNNING.md
          git commit -m "test: record Fanpage media verification run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:main

      - name: Verify public GitHub Pages URLs
        id: public
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nguyenlinhns-arch.github.io/cong-nhan-cac-tinh'
          CACHE="fanpage-${GITHUB_RUN_ID}"

          wait_text() {
            local url="$1"
            local output="$2"
            local expected="$3"
            local code=''
            for attempt in $(seq 1 60); do
              code=$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' --max-time 25 "${url}?v=${CACHE}-${attempt}" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$expected" "$output"; then
                printf '%s\n' "$code"
                return 0
              fi
              echo "Attempt ${attempt}: ${url} returned ${code}; waiting for Pages" >&2
              sleep 5
            done
            echo "Verification failed for ${url}; last HTTP status: ${code}" >&2
            test -f "$output" && head -80 "$output" >&2 || true
            return 1
          }

          HOME_URL="$BASE/tuyen-tho-mo/"
          MEDIA_URL="$BASE/tuyen-tho-mo/anh-video-thuc-te/"
          APP_URL="$BASE/tuyen-tho-mo/app.js"
          MODULE_URL="$BASE/tuyen-tho-mo/fanpage-media.js"
          STYLE_URL="$BASE/tuyen-tho-mo/fanpage-media.css"
          SITEMAP_URL="$BASE/tuyen-tho-mo/sitemap.xml"
          ROOT_URL="$BASE/"

          HOME_HTTP=$(wait_text "$HOME_URL" /tmp/home.html 'Thầy Linh – Tuyển Thợ Mỏ')
          MEDIA_HTTP=$(wait_text "$MEDIA_URL" /tmp/media.html 'Ảnh & video')
          APP_HTTP=$(wait_text "$APP_URL" /tmp/app.js 'fanpage-media.js')
          MODULE_HTTP=$(wait_text "$MODULE_URL" /tmp/fanpage-media.js 'data-fanpage-section')
          STYLE_HTTP=$(wait_text "$STYLE_URL" /tmp/fanpage-media.css '.section--fanpage')
          SITEMAP_HTTP=$(wait_text "$SITEMAP_URL" /tmp/sitemap.xml 'anh-video-thuc-te')
          ROOT_HTTP=$(wait_text "$ROOT_URL" /tmp/root.html 'Công nhân Thanh Hóa')

          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/' /tmp/media.html
          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/photos/' /tmp/media.html
          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/videos/' /tmp/media.html
          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/reels/' /tmp/media.html
          grep -Fq 'https://zalo.me/0963048585' /tmp/media.html
          grep -Fq 'https://m.me/thaylinhtuyenthomo' /tmp/media.html
          grep -Fq 'plugins/page.php' /tmp/fanpage-media.js
          grep -Fq "iframe.loading = 'lazy'" /tmp/fanpage-media.js
          grep -Fq 'CollectionPage' /tmp/media.html

          cat > /tmp/FANPAGE_MEDIA_VERIFICATION_RECEIPT.md <<EOF
          # Fanpage media deployment verification

          - Status: VERIFIED_SUCCESS
          - Feature: Public Fanpage photos, videos and Reels integration
          - Home URL: ${HOME_URL}
          - Home HTTP: ${HOME_HTTP}
          - Media page URL: ${MEDIA_URL}
          - Media page HTTP: ${MEDIA_HTTP}
          - App loader HTTP: ${APP_HTTP}
          - Fanpage module HTTP: ${MODULE_HTTP}
          - Fanpage stylesheet HTTP: ${STYLE_HTTP}
          - Sitemap HTTP: ${SITEMAP_HTTP}
          - Existing root website HTTP: ${ROOT_HTTP}
          - Facebook Page link: VERIFIED
          - Facebook Photos link: VERIFIED
          - Facebook Videos link: VERIFIED
          - Facebook Reels link: VERIFIED
          - Lazy-loaded Facebook timeline: VERIFIED
          - CollectionPage structured data: VERIFIED
          - Zalo CTA: VERIFIED
          - Messenger CTA: VERIFIED
          - Existing root website preserved: VERIFIED
          - Feature merge commit: 89390656b5d1101c34cfbdc3f67f5734c5715b01
          - Source commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Verified at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Rollback: revert commit 89390656b5d1101c34cfbdc3f67f5734c5715b01 and remove this receipt
          EOF

      - name: Store VERIFIED_SUCCESS receipt and clean temporary verifiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/FANPAGE_MEDIA_VERIFICATION_RECEIPT.md tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_RECEIPT.md
          rm -f tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_RUNNING.md
          rm -f tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_FAILURE.md
          rm -f .verify-fanpage-media-trigger .verify-fanpage-media-v2-trigger
          rm -f .github/workflows/verify-fanpage-media.yml .github/workflows/verify-fanpage-media-v2.yml
          git add -A
          git commit -m 'test: verify Fanpage media deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record verification failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_FAILURE.md <<EOF
          # Fanpage media verification failure

          - Status: FAILED
          - Production feature merge commit: 89390656b5d1101c34cfbdc3f67f5734c5715b01
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Failed at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Action: inspect workflow logs before declaring completion
          EOF
          rm -f tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_RUNNING.md
          rm -f .verify-fanpage-media-trigger .verify-fanpage-media-v2-trigger
          rm -f .github/workflows/verify-fanpage-media.yml .github/workflows/verify-fanpage-media-v2.yml
          git add -A
          git commit -m 'test: record Fanpage media verification failure [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
