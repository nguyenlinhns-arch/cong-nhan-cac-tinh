name: Refresh generated SEO output (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: refresh-seo-output-temp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.ref == 'agent/seo-quality-20260806' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Rebuild affected SEO pages
        run: |
          node tools/generate-province-pages-2026.mjs
          node tools/generate-seo-library.mjs
          node tools/generate-daily-seo-series.mjs
          node tools/enforce-blue-worker-illustrations.mjs
          node tools/enforce-site-brand.mjs

      - name: Commit refreshed HTML to the working branch
        shell: bash
        run: |
          find tuyen-tho-mo -name '*.html' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Generated HTML is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated SEO output"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
