name: Verify Fanpage media deployment

on:
  push:
    branches:
      - main
    paths:
      - '.verify-fanpage-media-trigger'
      - '.github/workflows/verify-fanpage-media.yml'

permissions:
  contents: write

concurrency:
  group: verify-fanpage-media-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'trigger: verify Fanpage media deployment')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public GitHub Pages content
        id: public
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nguyenlinhns-arch.github.io/cong-nhan-cac-tinh'
          CACHE="verify-${GITHUB_RUN_ID}"

          wait_text() {
            local url="$1"
            local output="$2"
            local expected="$3"
            local code=''
            for attempt in $(seq 1 60); do
              code=$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' --max-time 25 "${url}?v=${CACHE}-${attempt}" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$expected" "$output"; then
                printf '%s\n' "$code"
                return 0
              fi
              echo "Attempt ${attempt}: ${url} returned ${code}; waiting for GitHub Pages"
              sleep 5
            done
            echo "Public verification failed for ${url}; last HTTP status: ${code}" >&2
            test -f "$output" && head -80 "$output" >&2 || true
            return 1
          }

          wait_file() {
            local url="$1"
            local output="$2"
            local expected="$3"
            local code=''
            for attempt in $(seq 1 60); do
              code=$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' --max-time 25 "${url}?v=${CACHE}-${attempt}" || true)
              if [[ "$code" == '200' ]] && [[ -s "$output" ]] && grep -Fq "$expected" "$output"; then
                printf '%s\n' "$code"
                return 0
              fi
              echo "Attempt ${attempt}: ${url} returned ${code}; waiting for GitHub Pages"
              sleep 5
            done
            echo "Public asset verification failed for ${url}; last HTTP status: ${code}" >&2
            return 1
          }

          HOME_URL="$BASE/tuyen-tho-mo/"
          MEDIA_URL="$BASE/tuyen-tho-mo/anh-video-thuc-te/"
          APP_URL="$BASE/tuyen-tho-mo/app.js"
          MODULE_URL="$BASE/tuyen-tho-mo/fanpage-media.js"
          STYLE_URL="$BASE/tuyen-tho-mo/fanpage-media.css"
          ROOT_URL="$BASE/"

          HOME_HTTP=$(wait_text "$HOME_URL" /tmp/home.html 'Thầy Linh – Tuyển Thợ Mỏ')
          MEDIA_HTTP=$(wait_text "$MEDIA_URL" /tmp/media.html 'Ảnh & video')
          APP_HTTP=$(wait_file "$APP_URL" /tmp/app.js 'fanpage-media.js')
          MODULE_HTTP=$(wait_file "$MODULE_URL" /tmp/fanpage-media.js 'data-fanpage-section')
          STYLE_HTTP=$(wait_file "$STYLE_URL" /tmp/fanpage-media.css '.section--fanpage')
          ROOT_HTTP=$(wait_text "$ROOT_URL" /tmp/root.html 'Công nhân Thanh Hóa')

          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/' /tmp/media.html
          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/photos/' /tmp/media.html
          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/videos/' /tmp/media.html
          grep -Fq 'https://www.facebook.com/thaylinhtuyenthomo/reels/' /tmp/media.html
          grep -Fq 'https://zalo.me/0963048585' /tmp/media.html
          grep -Fq 'https://m.me/thaylinhtuyenthomo' /tmp/media.html
          grep -Fq 'plugins/page.php' /tmp/fanpage-media.js
          grep -Fq 'loading = '"'"'lazy'"'"'' /tmp/fanpage-media.js

          {
            echo "home_http=$HOME_HTTP"
            echo "media_http=$MEDIA_HTTP"
            echo "app_http=$APP_HTTP"
            echo "module_http=$MODULE_HTTP"
            echo "style_http=$STYLE_HTTP"
            echo "root_http=$ROOT_HTTP"
          } >> "$GITHUB_OUTPUT"

      - name: Store verification receipt and remove temporary verifier
        shell: bash
        env:
          HOME_HTTP: ${{ steps.public.outputs.home_http }}
          MEDIA_HTTP: ${{ steps.public.outputs.media_http }}
          APP_HTTP: ${{ steps.public.outputs.app_http }}
          MODULE_HTTP: ${{ steps.public.outputs.module_http }}
          STYLE_HTTP: ${{ steps.public.outputs.style_http }}
          ROOT_HTTP: ${{ steps.public.outputs.root_http }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cat > tuyen-tho-mo/FANPAGE_MEDIA_VERIFICATION_RECEIPT.md <<EOF
          # Fanpage media deployment verification

          - Status: VERIFIED_SUCCESS
          - Feature: Public Fanpage photos, videos and Reels integration
          - Home URL: https://nguyenlinhns-arch.github.io/cong-nhan-cac-tinh/tuyen-tho-mo/
          - Home HTTP: ${HOME_HTTP}
          - Media page URL: https://nguyenlinhns-arch.github.io/cong-nhan-cac-tinh/tuyen-tho-mo/anh-video-thuc-te/
          - Media page HTTP: ${MEDIA_HTTP}
          - App loader HTTP: ${APP_HTTP}
          - Fanpage module HTTP: ${MODULE_HTTP}
          - Fanpage stylesheet HTTP: ${STYLE_HTTP}
          - Existing root website HTTP: ${ROOT_HTTP}
          - Facebook Page link: VERIFIED
          - Facebook Photos link: VERIFIED
          - Facebook Videos link: VERIFIED
          - Facebook Reels link: VERIFIED
          - Lazy-loaded Facebook timeline: VERIFIED
          - Zalo CTA: VERIFIED
          - Messenger CTA: VERIFIED
          - Existing root website preserved: VERIFIED
          - Feature merge commit: 89390656b5d1101c34cfbdc3f67f5734c5715b01
          - Trigger commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Verified at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Rollback: revert commit 89390656b5d1101c34cfbdc3f67f5734c5715b01 and remove this receipt
          EOF

          rm -f .verify-fanpage-media-trigger
          rm -f .github/workflows/verify-fanpage-media.yml
          git add -A
          git commit -m 'test: verify Fanpage media deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
