name: Apply SEO queue 2026-11-11

on:
  push:
    paths:
      - '.github/workflows/apply-seo-queue-20261111.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'nguyenlinhns-arch/cong-nhan-cac-tinh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore validated SEO queue files
        shell: bash
        run: |
          set -euo pipefail
          cat .seo-patch/queue-20261111-part-* > "$RUNNER_TEMP/queue-20261111.tar.gz"
          echo "7fb36983e2f58d13a3e7fb42f008d450d5dfb8dbd6e260d0fad00a8c5d1cc934  $RUNNER_TEMP/queue-20261111.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/queue-20261111.tar.gz"
          node -e "JSON.parse(require('fs').readFileSync('content/daily-seo-articles.json','utf8')); JSON.parse(require('fs').readFileSync('content/approved-worker-images.json','utf8')); JSON.parse(require('fs').readFileSync('content/article-image-dimensions.json','utf8'))"
          test -s tuyen-tho-mo/assets/vinacomin-cong-nhan-theo-doi-bang-dieu-khien-tap-trung.webp
          git config user.name "nguyenlinhns-arch"
          git config user.email "nguyenlinhns@gmail.com"
          git add content/daily-seo-articles.json content/approved-worker-images.json content/article-image-dimensions.json tuyen-tho-mo/assets/vinacomin-cong-nhan-theo-doi-bang-dieu-khien-tap-trung.webp
          git rm -r .seo-patch .github/workflows/apply-seo-queue-20261111.yml
          git diff --cached --check
          git commit -m "Chuẩn bị giải đáp SEO ngày 2026-11-11"
          git push origin HEAD:main
