name: Patch payroll content count (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: patch-payroll-content-count-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'agent/mo-rong-kho-bang-luong-drive-20260806' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Derive payroll pages from payrolls.json
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('tools/validate-content-network.mjs')
          text = target.read_text(encoding='utf-8')
          old = '''const payrollPages = [
            ["bang-luong/index.html", "/bang-luong/"],
            ["bang-luong/vang-danh/quy-2-2026/index.html", "/bang-luong/vang-danh/quy-2-2026/"],
          ];'''
          new = '''const payrollData = JSON.parse(read("data/payrolls.json"));
          const payrollPages = [
            ["bang-luong/index.html", "/bang-luong/"],
            ...(payrollData.items || []).map((item) => {
              const url = new URL(item.url);
              const pathname = url.pathname.endsWith("/") ? url.pathname : `${url.pathname}/`;
              return [`${pathname.replace(/^\\/+/, "")}index.html`, pathname];
            }),
          ];'''
          if old not in text:
              raise SystemExit('Static payrollPages block was not found')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit patch to working branch
        shell: bash
        run: |
          git add tools/validate-content-network.mjs
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Đồng bộ số trang bảng lương trong kiểm định nội dung"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
