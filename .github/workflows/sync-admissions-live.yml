name: Sync live admissions aggregate

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-admissions-live.yml"

permissions:
  contents: write

concurrency:
  group: sync-live-admissions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SPREADSHEET_ID: "1eaWBK0Ty_jK7RmLjLqQBLalZ6wG5zUpPpjyCflPoQ-c"
      AGGREGATE_RANGE: "WEB_GITHUB_EXPORT!A140"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google auth client
        run: python3 -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Read and validate aggregate from private Google Sheet
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tuyen-tho-mo/nhap-hoc .github

          python3 <<'PY'
          import json
          import os
          import pathlib
          from urllib.parse import quote

          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          target = pathlib.Path("tuyen-tho-mo/nhap-hoc/live-report.json")
          status_target = pathlib.Path(".github/admissions-sync-status.json")
          status = {"state": "starting"}

          def write_status():
              status_target.write_text(
                  json.dumps(status, ensure_ascii=False, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )

          try:
              raw_credentials = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "").strip()
              if not raw_credentials:
                  status = {"state": "missing_credentials"}
                  raise RuntimeError("GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON is not configured")

              try:
                  info = json.loads(raw_credentials)
              except json.JSONDecodeError as exc:
                  status = {"state": "invalid_credentials_json"}
                  raise RuntimeError(f"Google service account secret is not valid JSON: {exc}") from exc

              service_email = str(info.get("client_email") or "")
              credentials = service_account.Credentials.from_service_account_info(
                  info,
                  scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"],
              )
              credentials.refresh(Request())

              spreadsheet_id = os.environ["SPREADSHEET_ID"]
              cell_range = quote(os.environ["AGGREGATE_RANGE"], safe="")
              url = f"https://sheets.googleapis.com/v4/spreadsheets/{spreadsheet_id}/values/{cell_range}"
              response = requests.get(
                  url,
                  headers={"Authorization": f"Bearer {credentials.token}"},
                  timeout=30,
              )
              if response.status_code != 200:
                  status = {
                      "state": f"google_http_{response.status_code}",
                      "service_account": service_email,
                  }
                  raise RuntimeError(f"Google Sheets API returned HTTP {response.status_code}")

              values = response.json().get("values") or []
              if not values or not values[0] or not str(values[0][0]).strip():
                  status = {"state": "empty_aggregate", "service_account": service_email}
                  raise RuntimeError("Google Sheets API returned no aggregate JSON")

              raw = str(values[0][0]).strip()
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError as exc:
                  status = {"state": "invalid_aggregate_json"}
                  raise RuntimeError(f"Invalid aggregate JSON from Google Sheets: {exc}") from exc

              if data.get("schema_version") != 1:
                  raise RuntimeError("Unexpected admissions aggregate schema_version")
              if not data.get("snapshot_date"):
                  raise RuntimeError("Missing snapshot_date")

              summary = data.get("summary") or {}
              required_summary = {
                  "base_3107", "aug_net", "system_total", "deleted", "remaining",
                  "retakes", "including_retakes", "today_count", "in_province_aug",
                  "in_province_total", "qc_aug", "qc_total"
              }
              missing = sorted(required_summary - set(summary))
              if missing:
                  raise RuntimeError(f"Missing summary fields: {', '.join(missing)}")

              if summary["base_3107"] + summary["aug_net"] != summary["system_total"]:
                  raise RuntimeError("Official total does not reconcile: base_3107 + aug_net != system_total")
              if summary["system_total"] - summary["deleted"] != summary["remaining"]:
                  raise RuntimeError("Official remaining total does not reconcile")
              if summary["system_total"] + summary["retakes"] != summary["including_retakes"]:
                  raise RuntimeError("Official total including retakes does not reconcile")

              for section in ("dv", "ph", "dn", "tinh", "qc"):
                  if not isinstance(data.get(section), list):
                      raise RuntimeError(f"Missing or invalid section: {section}")

              ph_total = sum((row.get("current") or [0] * 10)[9] for row in data["ph"])
              dn_total = sum(row.get("current_total", 0) for row in data["dn"])
              if ph_total != summary["system_total"]:
                  raise RuntimeError(f"Campus total mismatch: {ph_total} != {summary['system_total']}")
              if dn_total != summary["system_total"]:
                  raise RuntimeError(f"Company total mismatch: {dn_total} != {summary['system_total']}")

              forbidden_keys = {
                  "student_name", "full_name", "ho_ten", "cccd", "cmnd", "phone",
                  "phone_number", "mobile", "date_of_birth", "dob", "birth_date",
                  "student_id", "email"
              }

              def scan(obj, path="$"):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          if str(key).lower() in forbidden_keys:
                              raise RuntimeError(f"Public aggregate contains forbidden personal field at {path}.{key}")
                          scan(value, f"{path}.{key}")
                  elif isinstance(obj, list):
                      for i, value in enumerate(obj):
                          scan(value, f"{path}[{i}]")

              scan(data)
              data["pipeline_version"] = 1
              target.write_text(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              status = {
                  "state": "ok",
                  "snapshot_date": data["snapshot_date"],
                  "system_total": summary["system_total"],
              }
              print(f"Validated admissions aggregate for {data['snapshot_date']}: {summary['system_total']} official admissions")
          except Exception as exc:
              if status.get("state") == "starting":
                  status = {"state": "validation_error"}
              status["message"] = str(exc)[:200]
              write_status()
              raise
          else:
              write_status()
          PY

      - name: Commit aggregate or diagnostic status when changed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/admissions-sync-status.json
          if [ -f tuyen-tho-mo/nhap-hoc/live-report.json ]; then
            git add tuyen-tho-mo/nhap-hoc/live-report.json
          fi
          if git diff --cached --quiet; then
            echo "Admissions aggregate/status is unchanged."
            exit 0
          fi
          git commit -m "chore(nhap-hoc): sync live aggregate status"
          git pull --rebase origin main
          git push

      - name: Fail workflow when Google sync is not healthy
        if: steps.sync.outcome != 'success'
        run: exit 1
