name: Publish KCN comparison rewrite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-kcn-rewrite.yml'
      - 'tools/rewrite-kcn-comparison.mjs'
      - 'tools/enhance-verification-seo.mjs'
      - 'tuyen-tho-mo/chon-kcn-hay-lam-mo/index.html'
      - 'tuyen-tho-mo/kcn-comparison.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-kcn-rewrite
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the complete website
        run: |
          set -euo pipefail
          node tools/generate-province-pages-2026.mjs
          node tools/generate-legacy-redirects.mjs
          node tools/generate-job-board-pages.mjs
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-worker-first-home.mjs
          node tools/enhance-home-copy-actions.mjs
          node tools/build-search-index.mjs
          node tools/enhance-all-province-search.mjs
          node tools/enhance-natural-language-search.mjs
          node tools/enhance-answer-first-search.mjs
          node tools/enhance-worker-brief.mjs
          node tools/enhance-voice-loader.mjs
          node tools/enhance-search-answer-read-aloud.mjs
          node tools/enhance-direct-call.mjs
          node tools/enhance-application-context.mjs
          node tools/enhance-application-prefill-note.mjs
          node tools/validate-natural-language-search.mjs
          node tools/validate-all-province-search.mjs
          node tools/validate-answer-first-search.mjs
          node tools/validate-worker-brief.mjs
          node tools/validate-voice-assist.mjs
          node tools/validate-direct-call.mjs
          node tools/validate-home-copy-actions.mjs
          node tools/validate-application-context.mjs
          node tools/validate-worker-findability.mjs
          node tools/validate-universal-worker-compass.mjs
          node tools/validate-content-network.mjs
          node tools/validate-article-ctas.mjs
          node tools/validate-seo-library.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-accessibility.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-conversion-resilience.mjs
          node tools/test-home-video-facades.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-job-postings.mjs
          node tools/validate-recruitment-funnel.mjs
          node tools/test-recruitment-application.mjs
          node tools/validate-crm-automation.mjs
          grep -Fq 'đừng chỉ hỏi lương bao nhiêu' tuyen-tho-mo/chon-kcn-hay-lam-mo/index.html
          grep -Fq 'Bài toán 30 ngày' tuyen-tho-mo/chon-kcn-hay-lam-mo/index.html
          grep -Fq '1145886217664123' tuyen-tho-mo/chon-kcn-hay-lam-mo/index.html
          grep -Fq '/kcn-comparison.css?v=1' tuyen-tho-mo/chon-kcn-hay-lam-mo/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tuyen-tho-mo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the replacement on the custom domain
        env:
          LIVE_PAGE: https://thaylinhtuyenthomo.vn/chon-kcn-hay-lam-mo/
        run: |
          set -euo pipefail
          page_file="$(mktemp)"
          css_file="$(mktemp)"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 25 "${LIVE_PAGE}?deploy=${GITHUB_SHA}-${attempt}" -o "$page_file" \
              && curl --fail --silent --show-error --location --max-time 25 "https://thaylinhtuyenthomo.vn/kcn-comparison.css?deploy=${GITHUB_SHA}-${attempt}" -o "$css_file"; then
              if grep -Fq 'đừng chỉ hỏi lương bao nhiêu' "$page_file" \
                && grep -Fq 'Bài toán 30 ngày' "$page_file" \
                && grep -Fq '1145886217664123' "$page_file" \
                && grep -Fq 'Cam kết 20–25 triệu đồng/tháng khi hoàn thành định mức lao động.' "$page_file" \
                && grep -Fq '.kcn-video-layout' "$css_file"; then
                echo "Replacement article is live and verified on attempt $attempt."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "The replacement article was deployed but could not be verified on the custom domain in time."
          exit 1
