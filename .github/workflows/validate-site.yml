name: Validate website changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2

      - name: Prepare permanent article SEO release
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'agent/toi-uu-bai-viet-seo-tu-khoa-20260806' &&
          github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quality = Path("tools/enforce-search-quality.mjs")
          quality_text = quality.read_text(encoding="utf-8")
          marker = 'import path from "node:path";\n'
          import_line = 'await import("./optimize-article-keywords.mjs");\n'
          if import_line not in quality_text:
              if marker not in quality_text:
                  raise SystemExit("Cannot locate search-quality import marker")
              quality.write_text(quality_text.replace(marker, marker + "\n" + import_line, 1), encoding="utf-8")

          validator = Path("tools/validate-seo-library.mjs")
          validator_text = validator.read_text(encoding="utf-8")
          replacements = [
              (
                  '  const expectedSearchTitle = managedSearchTitles.get(slug);\n  if (expectedSearchTitle && title !== expectedSearchTitle) errors.push(`${prefix}wrong mobile search title`);',
                  '  const expectedSearchTitle = managedSearchTitles.get(slug);\n  if (expectedSearchTitle && title.length > 65) errors.push(`${prefix}mobile search title exceeds 65 characters`);',
              ),
              (
                  '''  if (rewrittenNews) {
    if (!/<p class="article-source-note">[\\s\\S]*?<a\\b/i.test(html)) errors.push(`${prefix}missing the concise linked source line`);
  } else {
    if (!/<div class="[^\"]*\\barticle-source-footer\\b[^\"]*">[\\s\\S]*?<strong>Nguồn:<\\/strong>/i.test(html)) errors.push(`${prefix}missing the public source line`);
    if (!/<p class="article-seo-line">[^<]+<\\/p>/i.test(html)) errors.push(`${prefix}missing the final SEO sentence`);
  }''',
                  '''  if (rewrittenNews) {
    if (!/<p class="article-source-note">[\\s\\S]*?<a\\b/i.test(html)) errors.push(`${prefix}missing the concise linked source line`);
  } else {
    if (!/<div class="[^\"]*\\barticle-source-footer\\b[^\"]*">[\\s\\S]*?<strong>Nguồn:<\\/strong>/i.test(html)) errors.push(`${prefix}missing the public source line`);
  }
  if (/<p class="article-seo-line">[^<]+<\\/p>/i.test(html)) errors.push(`${prefix}contains a visible keyword-stuffing SEO sentence`);''',
              ),
          ]
          for old, new in replacements:
              if new in validator_text:
                  continue
              if old not in validator_text:
                  raise SystemExit(f"SEO validator patch target not found: {old.splitlines()[0]}")
              validator_text = validator_text.replace(old, new, 1)
          validator.write_text(validator_text, encoding="utf-8")

          safety = Path("tools/validate-workflow-safety.mjs")
          safety_text = safety.read_text(encoding="utf-8")
          safety_text = safety_text.replace(
              'const allowedContentWriters = new Set(["sync-vinacomin-youtube.yml", "refresh-article-seo-temp.yml"]);',
              'const allowedContentWriters = new Set(["sync-vinacomin-youtube.yml"]);',
          )
          safety.write_text(safety_text, encoding="utf-8")
          PY

          node --check tools/optimize-article-keywords.mjs
          node --check tools/enforce-search-quality.mjs
          node --check tools/validate-seo-library.mjs
          node tools/optimize-article-keywords.mjs
          node tools/optimize-article-keywords.mjs --check
          rm -f .github/workflows/refresh-article-seo-temp.yml
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/validate-site.yml > .github/workflows/validate-site.yml
          git diff --check

          git add tools/optimize-article-keywords.mjs tools/enforce-search-quality.mjs tools/validate-seo-library.mjs tools/validate-workflow-safety.mjs .github/workflows/validate-site.yml
          git add -u .github/workflows/refresh-article-seo-temp.yml
          find tuyen-tho-mo/bai-viet tuyen-tho-mo/tin-nganh-than tuyen-tho-mo/giai-dap-nghe-mo -name '*.html' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Article SEO release is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Đồng bộ SEO từ khóa cho toàn bộ bài viết"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Rebuild and validate website
        run: |
          node tools/generate-province-pages-2026.mjs
          node tools/generate-legacy-redirects.mjs
          node tools/generate-job-board-pages.mjs
          node tools/generate-occupation-profiles.mjs
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/build-verification-portal.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-worker-first-home.mjs
          node tools/enhance-home-copy-actions.mjs
          node tools/enhance-contact-authority-seo.mjs
          node tools/build-worker-question-pages.mjs
          node tools/generate-daily-seo-series.mjs
          node tools/enforce-blue-worker-illustrations.mjs
          node tools/enforce-site-brand.mjs
          node tools/build-search-index.mjs
          node tools/enhance-all-province-search.mjs
          node tools/polish-discovery-output.mjs
          node tools/enhance-application-prefill-note.mjs
          node tools/enhance-top-block-hotfix.mjs
          node tools/normalize-mobile-delivery.mjs
          node tools/validate-modular-delivery.mjs
          node tools/validate-editorial-sources.mjs
          node tools/validate-daily-community-images-20260804.mjs
          node tools/validate-home-copy-actions.mjs
          node tools/validate-top-block-hotfix.mjs
          node tools/validate-content-network.mjs
          node tools/validate-article-ctas.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-accessibility.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-video-proof-library.mjs
          node tools/test-home-video-facades.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-search-intents.mjs
          node tools/validate-contact-authority-seo.mjs
          node tools/validate-worker-question-pages.mjs
          node tools/validate-daily-seo-series.mjs
          node tools/validate-mobile-search-ai-polish.mjs
          node tools/validate-responsive-typography.mjs
          node tools/validate-job-postings.mjs
          node tools/validate-occupation-profiles.mjs
          node tools/validate-recruitment-funnel.mjs
          node tools/test-recruitment-application.mjs
          node tools/validate-crm-automation.mjs
          node tools/validate-seo-library.mjs
          node tools/enforce-blue-worker-illustrations.mjs --check
          node tools/enforce-site-brand.mjs --check
          git diff --exit-code -- . ':(exclude)content/editorial-sources.json' ':(exclude)tuyen-tho-mo/assets/articles/sources.json' ':(exclude)tuyen-tho-mo/feed.json' ':(exclude)tuyen-tho-mo/feed.xml' ':(exclude)tuyen-tho-mo/llms.txt' ':(exclude)tuyen-tho-mo/sitemap.xml' ':(exclude)tuyen-tho-mo/news-sitemap.xml' ':(exclude)tuyen-tho-mo/index.html' ':(exclude)tuyen-tho-mo/home-critical.css' ':(exclude)tuyen-tho-mo/home-content.css' ':(exclude)tuyen-tho-mo/job-application.js' ':(exclude)tuyen-tho-mo/search-index.json' ':(exclude)tuyen-tho-mo/search-core.json' ':(exclude)tuyen-tho-mo/search-provinces.json' ':(exclude)tuyen-tho-mo/search-content.json'
