name: Distribute recruitment URLs

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule') }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Notify IndexNow search engines about recruitment URLs
        run: node tools/submit-indexnow.mjs
      - name: Notify Google Indexing API about open JobPosting URLs
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: node tools/submit-google-indexing.mjs
      - name: Submit sitemap to Google Search Console
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: node tools/submit-google-sitemap.mjs
      - name: Explain skipped Google submission
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "Google submission skipped because GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON is not configured."
