name: Apply SEO queue 2026-11-09

on:
  push:
    paths:
      - '.github/workflows/apply-seo-queue-20261109.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'nguyenlinhns-arch/cong-nhan-cac-tinh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore validated SEO queue files
        shell: bash
        run: |
          set -euo pipefail
          cat .seo-patch/queue-20261109-part-* > "$RUNNER_TEMP/queue-20261109.tar.gz"
          echo "986312f61c4ca0e498e14074464af6f6e331fbe097549cab3df83109c2848c1c  $RUNNER_TEMP/queue-20261109.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/queue-20261109.tar.gz"
          node -e "JSON.parse(require('fs').readFileSync('content/daily-seo-articles.json','utf8')); JSON.parse(require('fs').readFileSync('content/approved-worker-images.json','utf8')); JSON.parse(require('fs').readFileSync('content/article-image-dimensions.json','utf8'))"
          test -s tuyen-tho-mo/assets/vinacomin-tho-ha-long-huong-dan-thiet-bi-ham-lo.webp
          git config user.name "nguyenlinhns-arch"
          git config user.email "nguyenlinhns@gmail.com"
          git add content/daily-seo-articles.json content/approved-worker-images.json content/article-image-dimensions.json tuyen-tho-mo/assets/vinacomin-tho-ha-long-huong-dan-thiet-bi-ham-lo.webp
          git rm -r .seo-patch .github/workflows/apply-seo-queue-20261109.yml
          git diff --cached --check
          git commit -m "Chuẩn bị giải đáp SEO ngày 2026-11-09"
          git push origin HEAD:main
