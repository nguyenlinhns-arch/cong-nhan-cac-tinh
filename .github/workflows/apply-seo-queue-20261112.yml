name: Apply SEO queue 2026-11-12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-seo-queue-20261112.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified SEO source package
        run: |
          set -euo pipefail
          cat .seo-patch/queue-20261112-part-* > "$RUNNER_TEMP/payload.tar.gz"
          echo "ebc994409c9bc1c75ae1d2d52115a0c454c86d1d2a3fcc1a5a36f0fa8678ec8f  $RUNNER_TEMP/payload.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/payload.tar.gz"
          node -e "JSON.parse(require('node:fs').readFileSync('content/daily-seo-articles.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('content/approved-worker-images.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('content/article-image-dimensions.json','utf8'))"
          test -s tuyen-tho-mo/assets/vinacomin-cong-nhan-than-vang-danh-nhan-ca-lenh.webp
          git add content/daily-seo-articles.json content/approved-worker-images.json content/article-image-dimensions.json tuyen-tho-mo/assets/vinacomin-cong-nhan-than-vang-danh-nhan-ca-lenh.webp
          git rm -r .seo-patch .github/workflows/apply-seo-queue-20261112.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Chuẩn bị giải đáp SEO ngày 2026-11-12"
          git push origin HEAD:main
