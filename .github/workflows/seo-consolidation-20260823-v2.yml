name: SEO consolidation conflict-safe 2026-08-23

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seo-consolidation-20260823-v2.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and audit SEO consolidation
        shell: bash
        run: |
          cat > /tmp/seo-consolidate.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const siteRoot = path.join(root, 'tuyen-tho-mo');
          const homepage = path.join(siteRoot, 'index.html');
          const primary = path.join(siteRoot, 'tuyen-tho-mo-quang-ninh', 'index.html');
          const duplicate = path.join(siteRoot, 'viec-lam-nganh-than', 'quang-ninh', 'index.html');
          const detail = path.join(siteRoot, 'viec-lam', 'cong-nhan-mo-ham-lo-quang-ninh', 'index.html');
          const sitemap = path.join(siteRoot, 'sitemap.xml');
          const masterPath = path.join(root, 'operations', 'job-posting-master-2026.json');
          const primaryUrl = 'https://thaylinhtuyenthomo.vn/tuyen-tho-mo-quang-ninh/';
          const duplicateUrl = 'https://thaylinhtuyenthomo.vn/viec-lam-nganh-than/quang-ninh/';
          const tracked = [homepage, primary, duplicate, detail, sitemap, masterPath];
          for (const f of tracked) if (!fs.existsSync(f)) throw new Error(`Missing ${path.relative(root, f)}`);

          const replaceAll = (s, a, b) => s.split(a).join(b);
          const walk = (dir, out = []) => {
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const f = path.join(dir, e.name);
              e.isDirectory() ? walk(f, out) : out.push(f);
            }
            return out;
          };
          const write = (file, next) => {
            const old = fs.readFileSync(file, 'utf8');
            if (old !== next) {
              fs.writeFileSync(file, next);
              console.log('updated', path.relative(root, file));
            }
          };
          const incomeRules = [
            [/được cam kết thu nhập/gi, 'có mức thu nhập'],
            [/cam kết mức thu nhập/gi, 'mức thu nhập'],
            [/cam kết thu nhập/gi, 'thu nhập'],
            [/cam kết\s+20[–-]25\s+triệu\/tháng/gi, 'thu nhập 20–25 triệu/tháng'],
            [/cam kết\s+20[–-]25\s+triệu đồng\/tháng/gi, 'thu nhập 20–25 triệu đồng/tháng'],
            [/CAM KẾT THU NHẬP/g, 'THU NHẬP'],
            [/Có mức thu nhập không\?/g, 'Mức thu nhập áp dụng là bao nhiêu?']
          ];
          const neutralizeIncome = (s) => {
            for (const [rx, rep] of incomeRules) s = s.replace(rx, rep);
            return s;
          };

          // Authoritative recruitment source: retain compatibility keys, neutralize their values and prose.
          const master = JSON.parse(fs.readFileSync(masterPath, 'utf8'));
          let keyHits = 0;
          const rewriteKeys = (obj) => {
            if (!obj || typeof obj !== 'object') return;
            for (const [k,v] of Object.entries(obj)) {
              if (k === 'income_commitment' || k === 'income_reference') {
                obj[k] = 'Thu nhập 20–25 triệu đồng/tháng khi hoàn thành định mức lao động';
                keyHits++;
              } else if (v && typeof v === 'object') rewriteKeys(v);
            }
          };
          rewriteKeys(master);
          if (keyHits < 2) throw new Error(`Expected 2 income compatibility keys, found ${keyHits}`);
          let masterText = neutralizeIncome(JSON.stringify(master, null, 2) + '\n');
          write(masterPath, masterText);

          // Homepage becomes the broad learning/career hub; the dedicated page owns the core Quang Ninh recruitment query.
          let home = fs.readFileSync(homepage, 'utf8');
          const homePairs = [
            ['<title>Tuyển thợ mỏ, thợ lò Quảng Ninh | Học nghề, nhận việc</title>', '<title>Học nghề mỏ &amp; việc làm ngành Than 2026 | Thầy Linh</title>'],
            ['<title>Tuyển thợ mỏ, thợ lò Quảng Ninh 2026 | Thầy Linh</title>', '<title>Học nghề mỏ &amp; việc làm ngành Than 2026 | Thầy Linh</title>'],
            ['<meta name="description" content="Tuyển thợ mỏ, thợ lò tại Quảng Ninh: nam 18–40 tuổi; học nghề tại Quang Hanh, miễn học phí, có ăn ở và được bố trí việc làm sau đào tạo.">', '<meta name="description" content="Hướng dẫn học nghề mỏ, điều kiện, hồ sơ, quyền lợi và việc làm ngành Than năm 2026. Chọn thông tin theo nhu cầu và địa phương để đăng ký đúng lộ trình.">'],
            ['<meta name="keywords" content="tuyển thợ mỏ, tuyển thợ lò Quảng Ninh, học nghề mỏ Quang Hanh, việc làm ngành Than, việc làm TKV, hồ sơ học nghề mỏ">', '<meta name="keywords" content="học nghề mỏ, việc làm ngành Than, hồ sơ học nghề mỏ, điều kiện thợ lò, tuyển thợ mỏ theo tỉnh">'],
            ['<meta property="og:title" content="Tuyển thợ mỏ, thợ lò tại Quảng Ninh">', '<meta property="og:title" content="Học nghề mỏ &amp; việc làm ngành Than – Thầy Linh">'],
            ['<meta property="og:description" content="Kiểm tra điều kiện, xem công việc thực tế, học nghề tại Quang Hanh và đăng ký nhận việc ngành Than ở Quảng Ninh.">', '<meta property="og:description" content="Tìm hiểu nghề mỏ, điều kiện, hồ sơ, quyền lợi và lộ trình từ học nghề đến việc làm ngành Than.">'],
            ['<meta name="twitter:title" content="Tuyển thợ mỏ, thợ lò tại Quảng Ninh">', '<meta name="twitter:title" content="Học nghề mỏ &amp; việc làm ngành Than – Thầy Linh">'],
            ['<meta name="twitter:description" content="Xem điều kiện, video công việc thực tế, quyền lợi học nghề và cách đăng ký làm việc ngành Than tại Quảng Ninh.">', '<meta name="twitter:description" content="Tìm hiểu nghề mỏ, điều kiện, hồ sơ, quyền lợi và lộ trình từ học nghề đến việc làm ngành Than.">'],
            ['"name":"Tuyển thợ mỏ, thợ lò tại Quảng Ninh"', '"name":"Học nghề mỏ và việc làm ngành Than – Thầy Linh"'],
            ['"description":"Tuyển thợ mỏ, thợ lò tại Quảng Ninh: kiểm tra điều kiện, xem công việc thực tế, học nghề tại Quang Hanh và nhận việc ngành Than; cam kết thu nhập 20–25 triệu đồng/tháng khi hoàn thành định mức lao động."', '"description":"Hướng dẫn học nghề mỏ, điều kiện, hồ sơ, quyền lợi và lộ trình từ học nghề đến việc làm ngành Than năm 2026."'],
            ['<h1 id="home-v6-title">Tuyển thợ mỏ Quảng Ninh.<span>Bắt đầu từ đây.</span></h1>', '<h1 id="home-v6-title">Học nghề mỏ và việc làm ngành Than.<span>Bắt đầu từ đây.</span></h1>'],
            ['<h1 id="home-v6-title">Thầy Linh Tuyển Thợ Mỏ.<span>Đi đúng đường.</span></h1>', '<h1 id="home-v6-title">Học nghề mỏ và việc làm ngành Than.<span>Bắt đầu từ đây.</span></h1>'],
            ['<p class="home-v6-hero__lead">Muốn đi làm mỏ than Quảng Ninh? Xem công việc thực tế, chọn nghề phù hợp, kiểm tra điều kiện và được Thầy Linh hướng dẫn từ lúc đăng ký đến khi nhận việc.</p>', '<p class="home-v6-hero__lead">Tìm hiểu nghề mỏ, chọn nghề phù hợp, kiểm tra điều kiện và hồ sơ trước khi đăng ký. Nếu mục tiêu là làm việc tại Quảng Ninh, xem <a href="/tuyen-tho-mo-quang-ninh/">trang tuyển thợ mỏ Quảng Ninh 2026</a>.</p>'],
            ['<p class="home-v6-hero__lead">Tuyển thợ mỏ, thợ lò tại Quảng Ninh – Thầy Linh hướng dẫn trực tiếp từ lúc xem nghề, chọn ngành đến khi đủ điều kiện nhận việc.</p>', '<p class="home-v6-hero__lead">Tìm hiểu nghề mỏ, chọn nghề phù hợp, kiểm tra điều kiện và hồ sơ trước khi đăng ký. Nếu mục tiêu là làm việc tại Quảng Ninh, xem <a href="/tuyen-tho-mo-quang-ninh/">trang tuyển thợ mỏ Quảng Ninh 2026</a>.</p>']
          ];
          for (const [a,b] of homePairs) home = replaceAll(home, a, b);
          home = neutralizeIncome(home);
          write(homepage, home);

          // Overlapping Quang Ninh province page: preserve access, stop indexing, canonicalize to primary.
          let dup = fs.readFileSync(duplicate, 'utf8');
          dup = dup.replace(/<meta name="robots" content="index,follow[^\"]*">/, '<meta name="robots" content="noindex,follow,max-image-preview:large,max-snippet:-1">');
          dup = replaceAll(dup, '<title>Tuyển thợ mỏ tại Quảng Ninh | Học nghề 2–3 tháng – Thầy Linh</title>', '<title>Học nghề mỏ &amp; việc làm ngành Than tại Quảng Ninh | Thầy Linh</title>');
          dup = replaceAll(dup, '<meta property="og:title" content="Tuyển thợ mỏ tại Quảng Ninh – học nghề 2–3 tháng">', '<meta property="og:title" content="Học nghề mỏ &amp; việc làm ngành Than tại Quảng Ninh">');
          dup = replaceAll(dup, '<meta name="twitter:title" content="Tuyển thợ mỏ tại Quảng Ninh – học nghề 2–3 tháng">', '<meta name="twitter:title" content="Học nghề mỏ &amp; việc làm ngành Than tại Quảng Ninh">');
          dup = replaceAll(dup, duplicateUrl, primaryUrl);
          dup = neutralizeIncome(dup);
          write(duplicate, dup);

          // Remove the retired URL from sitemap before rewriting any other machine-readable references.
          let map = fs.readFileSync(sitemap, 'utf8');
          map = map.replace(/\s*<url>\s*<loc>https:\/\/thaylinhtuyenthomo\.vn\/viec-lam-nganh-than\/quang-ninh\/<\/loc>[\s\S]*?<\/url>/g, '');
          write(sitemap, map);

          // Consolidate internal/machine references and neutralize public income wording.
          const textExt = new Set(['.html','.json','.xml','.txt']);
          for (const file of walk(siteRoot)) {
            if (!textExt.has(path.extname(file))) continue;
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            if (file !== duplicate && file !== sitemap) {
              text = replaceAll(text, 'href="/viec-lam-nganh-than/quang-ninh/"', 'href="/tuyen-tho-mo-quang-ninh/"');
              text = replaceAll(text, duplicateUrl, primaryUrl);
            }
            text = neutralizeIncome(text);
            if (text !== before) fs.writeFileSync(file, text);
          }

          // Patch exact generated-source phrase variants without changing unrelated policy logic.
          for (const dirName of ['tools','content']) {
            const dir = path.join(root, dirName);
            if (!fs.existsSync(dir)) continue;
            for (const file of walk(dir)) {
              if (!['.mjs','.js','.json'].includes(path.extname(file))) continue;
              const before = fs.readFileSync(file, 'utf8');
              let text = neutralizeIncome(before);
              if (text !== before) fs.writeFileSync(file, text);
            }
          }

          // Audit invariants.
          const finalHome = fs.readFileSync(homepage, 'utf8');
          const finalPrimary = fs.readFileSync(primary, 'utf8');
          const finalDup = fs.readFileSync(duplicate, 'utf8');
          const finalDetail = fs.readFileSync(detail, 'utf8');
          const finalMap = fs.readFileSync(sitemap, 'utf8');
          const finalMaster = fs.readFileSync(masterPath, 'utf8');
          if (!finalHome.includes('<title>Học nghề mỏ &amp; việc làm ngành Than 2026 | Thầy Linh</title>')) throw new Error('Homepage title not consolidated');
          if (!finalHome.includes('<h1 id="home-v6-title">Học nghề mỏ và việc làm ngành Than.')) throw new Error('Homepage H1 not consolidated');
          if (!finalHome.includes('href="/tuyen-tho-mo-quang-ninh/"')) throw new Error('Homepage lacks primary internal link');
          if (!finalPrimary.includes(`<link rel="canonical" href="${primaryUrl}">`)) throw new Error('Primary canonical invalid');
          if (!finalDup.includes('name="robots" content="noindex,follow')) throw new Error('Duplicate not noindex');
          if (!finalDup.includes(`<link rel="canonical" href="${primaryUrl}">`)) throw new Error('Duplicate canonical invalid');
          if (finalMap.includes(duplicateUrl)) throw new Error('Duplicate still in sitemap');
          if (!finalMap.includes(primaryUrl)) throw new Error('Primary missing from sitemap');
          if (!finalDetail.includes('<link rel="canonical" href="https://thaylinhtuyenthomo.vn/viec-lam/cong-nhan-mo-ham-lo-quang-ninh/">')) throw new Error('Detail canonical changed');
          if (!finalDetail.includes('URLSearchParams') || !finalDetail.includes('province')) throw new Error('Province prefill lost');
          if (/cam kết(?: mức)? thu nhập/i.test(finalHome + finalPrimary + finalDup + finalDetail + finalMaster)) throw new Error('Legacy income wording remains on core/source');
          if (/cam kết\s+20[–-]25\s+triệu/i.test(finalHome + finalPrimary + finalDup + finalDetail + finalMaster)) throw new Error('Legacy income promise remains on core/source');
          if (!finalMaster.includes('"income_commitment": "Thu nhập 20–25 triệu đồng/tháng khi hoàn thành định mức lao động"')) throw new Error('Source income value not neutral');
          if (!finalHome.includes('G-PZRRY10JNN') || !finalHome.includes('1382247304000287')) throw new Error('Tracking IDs missing');
          console.log('SEO_AUDIT_PASS');
          NODE

          node /tmp/seo-consolidate.cjs

      - name: Commit safely on top of newest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/job-posting-master-2026.json tuyen-tho-mo tools content
          if ! git diff --cached --quiet; then
            git commit -m "seo: consolidate Quang Ninh intent and income wording"
          fi
          git fetch origin main
          git rebase origin/main
          node /tmp/seo-consolidate.cjs
          git add operations/job-posting-master-2026.json tuyen-tho-mo tools content
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
