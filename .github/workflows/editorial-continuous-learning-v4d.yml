name: Editorial quality gate v5

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/editorial-continuous-learning-v4d.yml'
      - 'content/editorial-*.md'
      - 'content/editorial-prose-v4/**'
      - 'tools/editorial-*.mjs'
      - 'tools/journalistic-source-edit.mjs'
      - 'tools/daily-community-articles*.mjs'
      - 'tools/community-articles*.mjs'
      - 'tools/curated-articles.mjs'
      - 'tools/press-story-articles.mjs'
      - 'tools/validate-editorial-*.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-continuous-learning-v4d.yml'
      - 'content/editorial-*.md'
      - 'content/editorial-prose-v4/**'
      - 'tools/editorial-*.mjs'
      - 'tools/journalistic-source-edit.mjs'
      - 'tools/daily-community-articles*.mjs'
      - 'tools/community-articles*.mjs'
      - 'tools/curated-articles.mjs'
      - 'tools/press-story-articles.mjs'
      - 'tools/validate-editorial-*.mjs'

permissions:
  contents: read

concurrency:
  group: editorial-quality-gate-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-editorial-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit source library
        shell: bash
        run: |
          mkdir -p content
          node tools/editorial-source-audit-v5.mjs > content/editorial-v5-source-audit.json

      - name: Build the same editorial library used by Pages
        shell: bash
        run: |
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/generate-daily-seo-series.mjs
          node tools/enforce-blue-worker-illustrations.mjs
          node tools/enforce-site-brand.mjs

      - name: Validate source and rendered editorial quality
        shell: bash
        run: |
          node tools/validate-editorial-source-v5.mjs | tee content/editorial-v5-source-validation.json
          node tools/validate-editorial-story-v3.mjs | tee content/editorial-v5-story-validation.json
          node tools/validate-editorial-authority.mjs | tee content/editorial-v5-authority-validation.json
          node tools/validate-editorial-prose-v4.mjs | tee content/editorial-v5-prose-validation.json
          node tools/validate-editorial-continuous-v4b.mjs | tee content/editorial-v5-rendered-validation.json

      - name: Show audit summary
        if: always()
        shell: bash
        run: |
          echo '=== Source audit ==='
          cat content/editorial-v5-source-audit.json || true
          echo '=== Source validation ==='
          cat content/editorial-v5-source-validation.json || true
          echo '=== Story validation ==='
          cat content/editorial-v5-story-validation.json || true
          echo '=== Authority validation ==='
          cat content/editorial-v5-authority-validation.json || true
          echo '=== Prose validation ==='
          cat content/editorial-v5-prose-validation.json || true
          echo '=== Rendered validation ==='
          cat content/editorial-v5-rendered-validation.json || true
          echo 'Editorial quality gate is read-only; it never commits or pushes generated files.'
