name: Normalize recruitment SEO copy v11

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize-recruitment-seo-copy-v11.mjs'
      - 'tools/generate-province-pages-2026.mjs'
      - 'content/daily-seo-articles.json'
      - 'tuyen-tho-mo/app.js'
      - '.github/workflows/recruitment-seo-copy-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recruitment-seo-copy-v11
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[seo-copy-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize source copy and crawl-clean province links
        run: node tools/normalize-recruitment-seo-copy-v11.mjs

      - name: Regenerate province pages from normalized source
        run: node tools/generate-province-pages-2026.mjs

      - name: Normalize regenerated output
        run: node tools/normalize-recruitment-seo-copy-v11.mjs

      - name: Verify URL, copy and schema guardrails
        shell: bash
        run: |
          set -euo pipefail
          node --check tuyen-tho-mo/app.js
          node --check tools/generate-province-pages-2026.mjs
          node --check tools/normalize-recruitment-seo-copy-v11.mjs
          if grep -RIlE 'href="[^" ]*cong-nhan-mo-ham-lo-quang-ninh/\?province=' tuyen-tho-mo/viec-lam-nganh-than --include='*.html' | grep -q .; then
            echo 'Crawlable province query URL remains in local pages' >&2
            exit 1
          fi
          if grep -RIlE '<strong>Cam kết thu nhập</strong>|được Thu nhập 20|Mức thu nhập được cam kết theo chính sách đang áp dụng' tuyen-tho-mo --include='*.html' | grep -q .; then
            echo 'Legacy recruitment copy remains in published HTML' >&2
            exit 1
          fi
          grep -q 'data-prefill-province="${name}"' tools/generate-province-pages-2026.mjs
          grep -q 'seo-topic-cluster' tools/generate-province-pages-2026.mjs
          grep -q 'lastReviewed: "2026-08-23"' tools/generate-province-pages-2026.mjs
          grep -q 'data-prefill-province=' tuyen-tho-mo/viec-lam-nganh-than/gia-lai/index.html
          grep -q 'Thu nhập theo định mức' tuyen-tho-mo/viec-lam-nganh-than/gia-lai/index.html
          grep -q 'Ba trang nên xem trước khi đăng ký' tuyen-tho-mo/viec-lam-nganh-than/gia-lai/index.html

      - name: Commit normalized SEO source and published pages
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'thaylinh-marketing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate-province-pages-2026.mjs content/daily-seo-articles.json tuyen-tho-mo
          git commit -m 'seo: normalize recruitment copy and clean province links [seo-copy-sync]'
          git push
