name: Publish Thay Linh website trial

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/thay-linh/**'
      - '.github/workflows/publish-thay-linh-trial.yml'

permissions:
  contents: write

concurrency:
  group: publish-thay-linh-trial
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild deployment archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .deploy/thay-linh
          cat .deploy/thay-linh/part-* | base64 --decode > /tmp/thay-linh-runtime.tar.gz
          echo '1f0acfe557d513dfe5b7c896adfdb3b8f93df2edf03554c2992d8bd8fe51a7dd  /tmp/thay-linh-runtime.tar.gz' | sha256sum --check --strict

      - name: Extract isolated trial website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tuyen-tho-mo
          mkdir -p tuyen-tho-mo
          tar -xzf /tmp/thay-linh-runtime.tar.gz -C tuyen-tho-mo

      - name: Run deployment smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tuyen-tho-mo/index.html
          test -s tuyen-tho-mo/styles.css
          test -s tuyen-tho-mo/app.js
          test -s tuyen-tho-mo/assets/og-cover.png
          test -s tuyen-tho-mo/viec-lam-nganh-than/gia-lai/index.html
          test -s tuyen-tho-mo/viec-lam-nganh-than/dak-lak/index.html
          test "$(find tuyen-tho-mo/viec-lam-nganh-than -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 10
          grep -Fq 'https://zalo.me/0963048585' tuyen-tho-mo/index.html
          grep -Fq 'https://m.me/thaylinhtuyenthomo' tuyen-tho-mo/index.html
          grep -Fq 'Tôi là ai' tuyen-tho-mo/index.html

      - name: Write deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > tuyen-tho-mo/DEPLOYMENT_RECEIPT.md <<EOF
          # Deployment receipt

          - Website: Thầy Linh – Tuyển Thợ Mỏ
          - Deployment mode: GitHub Pages trial, isolated subdirectory
          - Target path: /tuyen-tho-mo/
          - Source archive SHA-256: 1f0acfe557d513dfe5b7c896adfdb3b8f93df2edf03554c2992d8bd8fe51a7dd
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Deployed at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Rollback: revert the publish commit that added the tuyen-tho-mo directory.
          EOF

      - name: Remove one-time bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy/thay-linh
          rm -f .github/workflows/publish-thay-linh-trial.yml

      - name: Commit deployed website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes to commit.'
            exit 0
          fi
          git commit -m 'publish: deploy Thầy Linh website trial [skip ci]'
          git push origin HEAD:main
