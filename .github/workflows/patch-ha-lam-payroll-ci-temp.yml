name: Patch Hà Lầm payroll release (temporary)

on:
  push:
    branches: ["agent/add-ha-lam-q2-2026-payroll"]

permissions:
  contents: write

concurrency:
  group: patch-ha-lam-payroll-release-temp
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Preserve income qualification and tracked article masking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          curated = Path('tools/curated-articles.mjs')
          text = curated.read_text(encoding='utf-8')
          old = 'description: "Nam 18–40 tuổi có thể học nghề mỏ 2–3 tháng, được hỗ trợ trong thời gian học, bố trí việc làm và cam kết thu nhập 20–25 triệu/tháng khi hoàn thành định mức lao động.",'
          new = 'description: "Tuyển thợ mỏ tháng 8/2026: nam 18–40 tuổi, học nghề 2–3 tháng, được hỗ trợ, bố trí việc làm; cam kết 20–25 triệu/tháng khi hoàn thành định mức lao động.",'
          if old in text:
              text = text.replace(old, new, 1)
              curated.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Không tìm thấy mô tả tuyển thợ mỏ cần chuẩn hóa')

          optimizer = Path('tools/optimize-article-keywords.mjs')
          text = optimizer.read_text(encoding='utf-8')
          old = '''function maskGeneratedArticleDiffs(files) {
            if (CHECK_ONLY || process.env.GITHUB_ACTIONS !== "true") return false;
            try {
              const relative = files.map((file) => path.relative(ROOT, file));
              execFileSync("git", ["update-index", "--assume-unchanged", ...relative], {cwd: ROOT, stdio: "ignore"});
              return true;
            } catch (error) {
              console.warn(`Không thể đánh dấu đầu ra bài viết là sản phẩm build: ${error.message}`);
              return false;
            }
          }'''
          new = '''function maskGeneratedArticleDiffs(files) {
            if (CHECK_ONLY || process.env.GITHUB_ACTIONS !== "true") return false;
            try {
              const tracked = new Set(execFileSync("git", ["ls-files"], {cwd: ROOT, encoding: "utf8"})
                .split(/\\r?\\n/).filter(Boolean));
              const relative = files.map((file) => path.relative(ROOT, file)).filter((file) => tracked.has(file));
              if (!relative.length) return false;
              execFileSync("git", ["update-index", "--assume-unchanged", ...relative], {cwd: ROOT, stdio: "ignore"});
              return true;
            } catch (error) {
              console.warn(`Không thể đánh dấu đầu ra bài viết là sản phẩm build: ${error.message}`);
              return false;
            }
          }'''
          if old in text:
              text = text.replace(old, new, 1)
              optimizer.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Không tìm thấy hàm maskGeneratedArticleDiffs cần sửa')
          PY

      - name: Validate syntax and commit patch
        shell: bash
        run: |
          node --check tools/curated-articles.mjs
          node --check tools/optimize-article-keywords.mjs
          git diff --check
          git add tools/curated-articles.mjs tools/optimize-article-keywords.mjs
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Giữ điều kiện thu nhập và ổn định build SEO hằng ngày"
          git push origin "HEAD:${GITHUB_REF_NAME}"
