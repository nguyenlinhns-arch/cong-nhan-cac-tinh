name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Publish the next verified SEO answer and refresh sitemaps every day (07:10 Asia/Bangkok).
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rebuild content network and validate website
        run: |
          node tools/generate-province-pages-2026.mjs
          node tools/generate-legacy-redirects.mjs
          node tools/generate-job-board-pages.mjs
          node tools/generate-occupation-profiles.mjs
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/build-verification-portal.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-worker-first-home.mjs
          node tools/enhance-home-copy-actions.mjs
          node tools/enhance-contact-authority-seo.mjs
          node tools/build-worker-question-pages.mjs
          node tools/generate-daily-seo-series.mjs
          node tools/build-search-index.mjs
          node tools/enhance-all-province-search.mjs
          node tools/polish-discovery-output.mjs
          node tools/enhance-application-prefill-note.mjs
          node tools/enhance-top-block-hotfix.mjs
          node tools/normalize-mobile-delivery.mjs
          node tools/validate-modular-delivery.mjs
          node tools/validate-editorial-sources.mjs
          node tools/validate-daily-community-images-20260804.mjs
          node tools/validate-home-copy-actions.mjs
          node tools/validate-top-block-hotfix.mjs
          node tools/validate-content-network.mjs
          node tools/validate-article-ctas.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-accessibility.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-video-proof-library.mjs
          node tools/test-home-video-facades.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-search-intents.mjs
          node tools/validate-contact-authority-seo.mjs
          node tools/validate-worker-question-pages.mjs
          node tools/validate-daily-seo-series.mjs
          node tools/validate-mobile-search-ai-polish.mjs
          node tools/validate-job-postings.mjs
          node tools/validate-occupation-profiles.mjs
          node tools/validate-recruitment-funnel.mjs
          node tools/test-recruitment-application.mjs
          node tools/validate-crm-automation.mjs
          node tools/validate-seo-library.mjs
          node tools/validate-payroll-library.mjs
          git diff --exit-code -- . ':(exclude)content/editorial-sources.json' ':(exclude)tuyen-tho-mo/assets/articles/sources.json' ':(exclude)tuyen-tho-mo/feed.json' ':(exclude)tuyen-tho-mo/feed.xml' ':(exclude)tuyen-tho-mo/llms.txt' ':(exclude)tuyen-tho-mo/sitemap.xml' ':(exclude)tuyen-tho-mo/news-sitemap.xml' ':(exclude)tuyen-tho-mo/index.html' ':(exclude)tuyen-tho-mo/home-critical.css' ':(exclude)tuyen-tho-mo/home-content.css' ':(exclude)tuyen-tho-mo/job-application.js' ':(exclude)tuyen-tho-mo/search-index.json' ':(exclude)tuyen-tho-mo/search-core.json' ':(exclude)tuyen-tho-mo/search-provinces.json' ':(exclude)tuyen-tho-mo/search-content.json'
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the recruitment portal at the custom-domain root.
          path: ./tuyen-tho-mo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines about today's new SEO answer
        if: success() && github.event_name == 'schedule'
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          release_files="$(node tools/list-daily-seo-release.mjs)"
          if [ -z "$release_files" ]; then
            echo "No daily SEO answer is scheduled for today."
            exit 0
          fi
          INDEXNOW_CHANGED_FILES="$release_files" node tools/submit-indexnow.mjs
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            node tools/submit-google-sitemap.mjs
          else
            echo "Google sitemap submission skipped because the Search Console credential is not configured."
          fi
      - name: Verify live mobile, search and AI discovery release
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/
        run: |
          html_file="$(mktemp)"
          core_file="$(mktemp)"
          css_file="$(mktemp)"
          polish_file="$(mktemp)"
          shell_file="$(mktemp)"
          robots_file="$(mktemp)"
          llms_file="$(mktemp)"
          site_search_file="$(mktemp)"
          manifest_file="$(mktemp)"
          core_index_file="$(mktemp)"
          province_index_file="$(mktemp)"
          analytics_file="$(mktemp)"
          finder_file="$(mktemp)"
          application_file="$(mktemp)"
          contact_authority_file="$(mktemp)"
          daily_seo_hub_file="$(mktemp)"
          daily_seo_article_file="$(mktemp)"
          daily_seo_json_file="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$LIVE_URL" -o "$html_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-core.js?run=${GITHUB_SHA}" -o "$core_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-core.css?run=${GITHUB_SHA}" -o "$css_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-polish-20260803.css?run=${GITHUB_SHA}" -o "$polish_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}site-shell-20260803.js?run=${GITHUB_SHA}" -o "$shell_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}robots.txt?run=${GITHUB_SHA}" -o "$robots_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}llms.txt?run=${GITHUB_SHA}" -o "$llms_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}site-search.js?run=${GITHUB_SHA}" -o "$site_search_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}search-index.json?run=${GITHUB_SHA}" -o "$manifest_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}search-core.json?run=${GITHUB_SHA}" -o "$core_index_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}search-provinces.json?run=${GITHUB_SHA}" -o "$province_index_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}analytics.js?run=${GITHUB_SHA}" -o "$analytics_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}worker-info-finder.js?run=${GITHUB_SHA}" -o "$finder_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}job-application.js?run=${GITHUB_SHA}" -o "$application_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}lien-he-di-lam-mo-than-quang-ninh/?run=${GITHUB_SHA}" -o "$contact_authority_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}giai-dap-nghe-mo/?run=${GITHUB_SHA}" -o "$daily_seo_hub_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}giai-dap-nghe-mo/lo-trinh-di-lam-mo-than-quang-ninh-tu-dang-ky-den-nhan-viec/?run=${GITHUB_SHA}" -o "$daily_seo_article_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}daily-seo-articles.json?run=${GITHUB_SHA}" -o "$daily_seo_json_file"; then
              if grep -Fq 'class="home-funnel"' "$html_file" \
                && grep -Fq '/home-critical.css?v=1' "$html_file" \
                && grep -Fq '/home-content.css?v=2' "$html_file" \
                && grep -Fq '/mobile-core.js?v=1' "$html_file" \
                && grep -Fq 'class="home-province-quick"' "$html_file" \
                && grep -Fq 'id="kho-noi-dung"' "$html_file" \
                && grep -Fq 'id="tu-kiem-tra"' "$html_file" \
                && grep -Fq 'data-open-site-search' "$html_file" \
                && grep -Fq '/worker-info-finder.js?v=4' "$html_file" \
                && grep -Fq '20–25 triệu/tháng' "$html_file" \
                && grep -Fq 'khi hoàn thành định mức lao động' "$html_file" \
                && grep -Fq '/site-search.js?v=1' "$core_file" \
                && grep -Fq '/worker-brief.js?v=1' "$core_file" \
                && grep -Fq '/voice-assist.js?v=3' "$core_file" \
                && grep -Fq 'tl-mobile-contact__messenger' "$core_file" \
                && grep -Fq '.tl-worker-compass{' "$css_file" \
                && grep -Fq '.verification-comparison td:nth-child(2)::before' "$polish_file" \
                && grep -Fq '.network-header__inner' "$polish_file" \
                && grep -Fq 'polishMobileContact' "$shell_file" \
                && grep -Fq '20260803-v3' "$shell_file" \
                && grep -Fq 'User-agent: OAI-SearchBot' "$robots_file" \
                && grep -Fq 'User-agent: PerplexityBot' "$robots_file" \
                && grep -Fq 'User-agent: Claude-SearchBot' "$robots_file" \
                && grep -Fq '## Dữ liệu máy đọc và nguồn cập nhật' "$llms_file" \
                && grep -Fq '## Trang trả lời theo nhu cầu tìm kiếm' "$llms_file" \
                && grep -Fq 'search-content.json?v=1' "$site_search_file" \
                && grep -Fq 'mobile.activateVoice' "$site_search_file" \
                && grep -Fq 'condition_check_complete' "$finder_file" \
                && grep -Fq 'data-contact="application"' "$finder_file" \
                && grep -Fq 'measurement_client_id' "$application_file" \
                && grep -Fq 'internal_campaign' "$application_file" \
                && grep -Fq 'Muốn đi làm mỏ than Quảng Ninh thì liên hệ với ai?' "$contact_authority_file" \
                && grep -Fq 'Nguyễn Tử Linh (Thầy Linh)' "$contact_authority_file" \
                && grep -Fq '096 304 8585' "$contact_authority_file" \
                && grep -Fq 'https://thaylinhtuyenthomo.vn/lien-he-di-lam-mo-than-quang-ninh/' "$contact_authority_file" \
                && grep -Fq 'Giải đáp nghề mỏ Quảng Ninh mỗi ngày' "$daily_seo_hub_file" \
                && grep -Fq 'Lộ trình đi làm mỏ than Quảng Ninh từ đăng ký đến nhận việc' "$daily_seo_article_file" \
                && grep -Fq '"canonical_hub": "https://thaylinhtuyenthomo.vn/giai-dap-nghe-mo/"' "$daily_seo_json_file" \
                && grep -Fq '"version": 4' "$manifest_file" \
                && grep -Fq '"strategy": "answer-first-tiered"' "$manifest_file" \
                && grep -Fq '"discovery"' "$manifest_file" \
                && grep -Fq '"title": "Học xong làm việc ở đâu?"' "$core_index_file" \
                && [ "$(grep -Fc '"category": "province"' "$province_index_file")" -eq 26 ] \
                && grep -Fq 'analytics-vendors.js?v=1' "$analytics_file"; then
                echo "Live mobile polish, tiered search, AI crawler access and recruitment funnel verified on attempt $attempt."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "The custom domain did not expose the complete mobile, search and AI discovery release."
          exit 1
      - name: Verify live payroll library
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/
        run: |
          payroll_hub="$(mktemp)"
          payroll_detail="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}bang-luong/?run=${GITHUB_SHA}" -o "$payroll_hub" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}bang-luong/vang-danh/quy-2-2026/?run=${GITHUB_SHA}" -o "$payroll_detail" \
              && grep -Fq 'Bảng lương công nhân ngành Than theo công ty, theo quý' "$payroll_hub" \
              && grep -Fq 'Bảng lương thợ lò Than Vàng Danh quý II/2026' "$payroll_detail" \
              && grep -Fq '15J-vCKwY6TcZjVkd_18xIA90x5gJ3n7x' "$payroll_detail"; then
              echo "Live payroll hub, company detail and controlled Drive PDF link verified on attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo "The custom domain did not expose the payroll library release."
          exit 1
      - name: Record deployment receipt
        if: success() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="$(printf '✅ **Triển khai và xác minh tên miền thành công**\n\n- Commit: `%s`\n- Workflow run: `%s`\n- URL triển khai: %s\n- Tên miền đã kiểm tra: https://thaylinhtuyenthomo.vn/\n- Thời điểm UTC: `%s`\n- Kết quả: giao diện mobile, tìm kiếm nội bộ, sitemap, llms.txt và quyền truy cập cho các bot tìm kiếm/AI đã được xác minh; luồng tỉnh/nghề, gọi, Zalo, tự kiểm tra và đăng ký tiếp tục hoạt động.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOYMENT_URL" "$deployed_at")"
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "$body"
