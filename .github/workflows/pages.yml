name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the 48-hour Google News sitemap every day (23:17 Asia/Bangkok).
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rebuild content network and validate website
        run: |
          node tools/generate-province-pages-2026.mjs
          node tools/generate-legacy-redirects.mjs
          node tools/generate-job-board-pages.mjs
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-worker-first-home.mjs
          node tools/enhance-home-copy-actions.mjs
          node tools/build-search-index.mjs
          node tools/enhance-all-province-search.mjs
          node tools/enhance-natural-language-search.mjs
          node tools/enhance-answer-first-search.mjs
          node tools/enhance-worker-brief.mjs
          node tools/enhance-voice-loader.mjs
          node tools/enhance-search-answer-read-aloud.mjs
          node tools/enhance-direct-call.mjs
          node tools/enhance-application-context.mjs
          node tools/enhance-application-prefill-note.mjs
          node tools/enhance-top-block-hotfix.mjs
          node tools/validate-natural-language-search.mjs
          node tools/validate-all-province-search.mjs
          node tools/validate-answer-first-search.mjs
          node tools/validate-worker-brief.mjs
          node tools/validate-voice-assist.mjs
          node tools/validate-direct-call.mjs
          node tools/validate-home-copy-actions.mjs
          node tools/validate-application-context.mjs
          node tools/validate-worker-findability.mjs
          node tools/validate-top-block-hotfix.mjs
          node tools/validate-universal-worker-compass.mjs
          node tools/validate-content-network.mjs
          node tools/validate-article-ctas.mjs
          node tools/validate-seo-library.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-accessibility.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-conversion-resilience.mjs
          node tools/test-home-video-facades.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-job-postings.mjs
          node tools/validate-recruitment-funnel.mjs
          node tools/test-recruitment-application.mjs
          node tools/validate-crm-automation.mjs
          git diff --exit-code -- . ':(exclude)tuyen-tho-mo/index.html' ':(exclude)tuyen-tho-mo/mobile-ux.js' ':(exclude)tuyen-tho-mo/voice-assist.js' ':(exclude)tuyen-tho-mo/job-application.js' ':(exclude)tuyen-tho-mo/search-index.json'
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the recruitment portal at the custom-domain root.
          path: ./tuyen-tho-mo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live worker-first homepage
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/
        run: |
          html_file="$(mktemp)"
          ux_file="$(mktemp)"
          css_file="$(mktemp)"
          search_file="$(mktemp)"
          voice_file="$(mktemp)"
          finder_file="$(mktemp)"
          application_file="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$LIVE_URL" -o "$html_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-ux.js?run=${GITHUB_SHA}" -o "$ux_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-ux.css?run=${GITHUB_SHA}" -o "$css_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}search-index.json?run=${GITHUB_SHA}" -o "$search_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}voice-assist.js?run=${GITHUB_SHA}" -o "$voice_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}worker-info-finder.js?run=${GITHUB_SHA}" -o "$finder_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}job-application.js?run=${GITHUB_SHA}" -o "$application_file"; then
              if grep -Fq 'id="worker-quick-title"' "$html_file" \
                && grep -Fq 'id="home-journey-title"' "$html_file" \
                && grep -Fq 'id="learning-story-title"' "$html_file" \
                && grep -Fq '/site-shell-20260803.css?v=3' "$html_file" \
                && grep -Fq 'id="tu-kiem-tra"' "$html_file" \
                && grep -Fq 'data-open-site-search' "$html_file" \
                && grep -Fq 'data-worker-province-select' "$html_file" \
                && grep -Fq 'data-worker-copy="admission_address"' "$html_file" \
                && grep -Fq 'data-worker-copy="application_message"' "$html_file" \
                && grep -Fq '/worker-info-finder.js?v=3' "$html_file" \
                && grep -Fq 'id="che-do-ho-so"' "$html_file" \
                && grep -Fq 'id="theo-tinh"' "$html_file" \
                && grep -Fq 'id="noi-lam-viec"' "$html_file" \
                && grep -Fq 'Cơ điện mỏ: 10 tháng' "$html_file" \
                && grep -Fq '/mobile-ux.js?v=8' "$html_file" \
                && grep -Fq '/mobile-ux.css?v=6' "$html_file" \
                && grep -Fq '20–25 triệu/tháng khi hoàn thành định mức lao động' "$html_file" \
                && grep -Fq 'function createWorkerCompass()' "$ux_file" \
                && grep -Fq 'tl-search-shortcuts' "$ux_file" \
                && grep -Fq 'const SEARCH_INTENTS = [' "$ux_file" \
                && grep -Fq 'function meaningfulQueryTerms' "$ux_file" \
                && grep -Fq 'function oneEditApart(left, right)' "$ux_file" \
                && grep -Fq 'function buildSearchAnswer(value, matches)' "$ux_file" \
                && grep -Fq 'const RECRUITMENT_YEAR = 2026' "$ux_file" \
                && grep -Fq 'function compactMobileConsentBanner()' "$ux_file" \
                && grep -Fq 'panel.dataset.searchAnswer = answer.kind' "$ux_file" \
                && grep -Fq 'Câu trả lời ngay và' "$ux_file" \
                && grep -Fq 'function createWorkerBriefDialog()' "$ux_file" \
                && grep -Fq 'data-open-worker-brief' "$ux_file" \
                && grep -Fq 'Tuyển thợ mỏ trong 30 giây' "$ux_file" \
                && grep -Fq 'brief_to_application_2026' "$ux_file" \
                && grep -Fq 'function loadVoiceAssist()' "$ux_file" \
                && grep -Fq '/voice-assist.js?v=2' "$ux_file" \
                && grep -Fq 'const PHONE_URL = "tel:+84963048585"' "$ux_file" \
                && grep -Fq 'class="tl-mobile-contact__call"' "$ux_file" \
                && grep -Fq 'data-worker-brief-action="phone"' "$ux_file" \
                && grep -Fq 'data-worker-shortcut="empty_phone"' "$ux_file" \
                && grep -Fq 'phone.dataset.context = "search-answer"' "$ux_file" \
                && grep -Fq 'function applicationContext()' "$ux_file" \
                && grep -Fq 'Object.entries(applicationContext())' "$ux_file" \
                && ! grep -Fq 'MESSENGER_URL' "$ux_file" \
                && grep -Fq 'Gõ cả câu, ví dụ: lương bao nhiêu?' "$ux_file" \
                && grep -Fq 'function setupVoiceSearch(dialog)' "$voice_file" \
                && grep -Fq 'window.SpeechRecognition || window.webkitSpeechRecognition' "$voice_file" \
                && grep -Fq 'function setupBriefReadAloud(dialog)' "$voice_file" \
                && grep -Fq 'function setupSearchAnswerReadAloud(dialog)' "$voice_file" \
                && grep -Fq '[data-answer-read-aloud]' "$voice_file" \
                && grep -Fq '🔊 Nghe câu trả lời' "$voice_file" \
                && grep -Fq 'Trình duyệt xử lý giọng nói; website không lưu âm thanh hay câu hỏi.' "$voice_file" \
                && grep -Fq 'window.ThayLinhVoiceAssist = Object.freeze({ init })' "$voice_file" \
                && grep -Fq 'const COPY_VALUES = Object.freeze({' "$finder_file" \
                && grep -Fq 'navigator.clipboard.writeText(value)' "$finder_file" \
                && grep -Fq 'document.execCommand("copy")' "$finder_file" \
                && grep -Fq 'track("worker_copy", { item: key, result: copied ? "success" : "failure" })' "$finder_file" \
                && grep -Fq 'const prefilledContext = []' "$application_file" \
                && grep -Fq 'draftStatus.dataset.contextPrefilled = "true"' "$application_file" \
                && grep -Fq 'track("ApplicationContextPrefill"' "$application_file" \
                && grep -Fq '"version": 3' "$search_file" \
                && grep -Fq '"title": "Học xong làm việc ở đâu?"' "$search_file" \
                && [ "$(grep -Fc '"category": "province"' "$search_file")" -eq 26 ] \
                && grep -Fq '"url": "/viec-lam-nganh-than/ha-noi/"' "$search_file" \
                && grep -Fq '"url": "/viec-lam-nganh-than/lang-son/"' "$search_file" \
                && grep -Fq '"searchScope": "internal"' "$search_file" \
                && grep -Fq '.tl-worker-compass{' "$css_file"; then
                echo "Live worker-first homepage, all-province internal search, province-preserving application links and spoken answers verified on attempt $attempt."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "The custom domain did not expose all 26 province pages through internal search while preserving the worker-first flow."
          exit 1
      - name: Record deployment receipt
        if: success() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="$(printf '✅ **Triển khai và xác minh tên miền thành công**\n\n- Commit: `%s`\n- Workflow run: `%s`\n- URL triển khai: %s\n- Tên miền đã kiểm tra: https://thaylinhtuyenthomo.vn/\n- Thời điểm UTC: `%s`\n- Kết quả: tìm kiếm nội bộ đã nhận đủ 26 tỉnh, thành và các địa danh cũ; những trang chưa có tư liệu riêng vẫn giữ noindex trên công cụ tìm kiếm bên ngoài. Luồng giữ tỉnh/nghề, sao chép, gọi, Zalo, giọng nói và tự kiểm tra tiếp tục hoạt động.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOYMENT_URL" "$deployed_at")"
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "$body"
