name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the 48-hour Google News sitemap every day (23:17 Asia/Bangkok).
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rebuild content network and validate website
        run: |
          node tools/generate-province-pages-2026.mjs
          node tools/generate-legacy-redirects.mjs
          node tools/generate-job-board-pages.mjs
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-worker-first-home.mjs
          node tools/build-search-index.mjs
          node tools/validate-worker-findability.mjs
          node tools/validate-content-network.mjs
          node tools/validate-seo-library.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-accessibility.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-conversion-resilience.mjs
          node tools/test-home-video-facades.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-job-postings.mjs
          node tools/validate-recruitment-funnel.mjs
          node tools/test-recruitment-application.mjs
          node tools/validate-crm-automation.mjs
          git diff --exit-code -- . ':(exclude)tuyen-tho-mo/index.html'
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the recruitment portal at the custom-domain root.
          path: ./tuyen-tho-mo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live worker-first homepage
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/
        run: |
          html_file="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$LIVE_URL" -o "$html_file"; then
              if grep -Fq 'id="worker-quick-title"' "$html_file" \
                && grep -Fq 'id="tu-kiem-tra"' "$html_file" \
                && grep -Fq 'data-open-site-search' "$html_file" \
                && grep -Fq 'data-worker-province-select' "$html_file" \
                && grep -Fq 'id="che-do-ho-so"' "$html_file" \
                && grep -Fq 'id="theo-tinh"' "$html_file" \
                && grep -Fq '20–25 triệu/tháng khi hoàn thành định mức lao động' "$html_file"; then
                echo "Live worker-first homepage and information finder verified on attempt $attempt."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "The custom domain did not expose the expected worker-first homepage and information finder."
          exit 1
      - name: Record deployment receipt
        if: success() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="$(printf '✅ **Triển khai và xác minh tên miền thành công**\n\n- Commit: `%s`\n- Workflow run: `%s`\n- URL triển khai: %s\n- Tên miền đã kiểm tra: https://thaylinhtuyenthomo.vn/\n- Thời điểm UTC: `%s`\n- Kết quả: trang thật có luồng worker-first, tìm kiếm toàn website, bộ chọn tỉnh, tự kiểm tra điều kiện, cam kết thu nhập và các neo liên kết tương thích.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOYMENT_URL" "$deployed_at")"
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "$body"
