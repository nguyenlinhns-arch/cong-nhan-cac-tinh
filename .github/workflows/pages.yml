name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the 48-hour Google News sitemap every day (23:17 Asia/Bangkok).
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rebuild content network and validate website
        run: |
          node tools/generate-province-pages-2026.mjs
          node tools/generate-legacy-redirects.mjs
          node tools/generate-job-board-pages.mjs
          node tools/generate-content-network.mjs
          node tools/generate-seo-library.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-worker-first-home.mjs
          node tools/build-search-index.mjs
          node tools/enhance-natural-language-search.mjs
          node tools/enhance-answer-first-search.mjs
          node tools/enhance-worker-brief.mjs
          node tools/validate-natural-language-search.mjs
          node tools/validate-answer-first-search.mjs
          node tools/validate-worker-brief.mjs
          node tools/validate-worker-findability.mjs
          node tools/validate-universal-worker-compass.mjs
          node tools/validate-content-network.mjs
          node tools/validate-seo-library.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-accessibility.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-conversion-resilience.mjs
          node tools/test-home-video-facades.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-job-postings.mjs
          node tools/validate-recruitment-funnel.mjs
          node tools/test-recruitment-application.mjs
          node tools/validate-crm-automation.mjs
          git diff --exit-code -- . ':(exclude)tuyen-tho-mo/index.html' ':(exclude)tuyen-tho-mo/mobile-ux.js'
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the recruitment portal at the custom-domain root.
          path: ./tuyen-tho-mo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live worker-first homepage
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/
        run: |
          html_file="$(mktemp)"
          ux_file="$(mktemp)"
          css_file="$(mktemp)"
          search_file="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$LIVE_URL" -o "$html_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-ux.js?run=${GITHUB_SHA}" -o "$ux_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}mobile-ux.css?run=${GITHUB_SHA}" -o "$css_file" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}search-index.json?run=${GITHUB_SHA}" -o "$search_file"; then
              if grep -Fq 'id="worker-quick-title"' "$html_file" \
                && grep -Fq 'id="tu-kiem-tra"' "$html_file" \
                && grep -Fq 'data-open-site-search' "$html_file" \
                && grep -Fq 'data-worker-province-select' "$html_file" \
                && grep -Fq 'id="che-do-ho-so"' "$html_file" \
                && grep -Fq 'id="theo-tinh"' "$html_file" \
                && grep -Fq 'id="noi-lam-viec"' "$html_file" \
                && grep -Fq 'Cơ điện mỏ: 10 tháng' "$html_file" \
                && grep -Fq '/mobile-ux.js?v=7' "$html_file" \
                && grep -Fq '20–25 triệu/tháng khi hoàn thành định mức lao động' "$html_file" \
                && grep -Fq 'function createWorkerCompass()' "$ux_file" \
                && grep -Fq 'tl-search-shortcuts' "$ux_file" \
                && grep -Fq 'const SEARCH_INTENTS = [' "$ux_file" \
                && grep -Fq 'function meaningfulQueryTerms' "$ux_file" \
                && grep -Fq 'function oneEditApart(left, right)' "$ux_file" \
                && grep -Fq 'function buildSearchAnswer(value, matches)' "$ux_file" \
                && grep -Fq 'panel.dataset.searchAnswer = answer.kind' "$ux_file" \
                && grep -Fq 'Câu trả lời ngay và' "$ux_file" \
                && grep -Fq 'function createWorkerBriefDialog()' "$ux_file" \
                && grep -Fq 'data-open-worker-brief' "$ux_file" \
                && grep -Fq 'Tuyển thợ mỏ trong 30 giây' "$ux_file" \
                && grep -Fq 'brief_to_application_2026' "$ux_file" \
                && grep -Fq 'Gõ cả câu, ví dụ: lương bao nhiêu?' "$ux_file" \
                && grep -Fq '"version": 3' "$search_file" \
                && grep -Fq '"title": "Học xong làm việc ở đâu?"' "$search_file" \
                && grep -Fq '.tl-worker-compass{' "$css_file"; then
                echo "Live worker-first homepage, 30-second brief, answer-first natural-language search and universal compass verified on attempt $attempt."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "The custom domain did not expose the expected worker-first homepage, 30-second brief, answer-first search and universal compass."
          exit 1
      - name: Record deployment receipt
        if: success() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="$(printf '✅ **Triển khai và xác minh tên miền thành công**\n\n- Commit: `%s`\n- Workflow run: `%s`\n- URL triển khai: %s\n- Tên miền đã kiểm tra: https://thaylinhtuyenthomo.vn/\n- Thời điểm UTC: `%s`\n- Kết quả: trang thật có luồng worker-first, thanh chỉ đường và tóm tắt 30 giây trên mọi trang sâu, tìm kiếm hiểu câu hỏi tự nhiên và trả lời ngay, hỗ trợ kiểm tra sơ bộ tuổi/chiều cao/cân nặng, bộ chọn tỉnh, tự kiểm tra điều kiện và cam kết thu nhập.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOYMENT_URL" "$deployed_at")"
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "$body"
