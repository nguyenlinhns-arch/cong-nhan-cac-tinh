name: Deploy Admissions Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'tuyen-tho-mo/nhap-hoc/**'
      - '.github/workflows/deploy-admissions.yml'
      - '.github/workflows/verify-nhap-hoc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admissions-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate unique snapshot admissions aggregate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tuyen-tho-mo/nhap-hoc/live-report.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          s = data['summary']

          assert data.get('schema_version') == 2
          assert data.get('method') == 'BASE_3107_PLUS_UNIQUE_DSHS_DELTA'
          assert isinstance(data.get('snapshot_date'), str) and data['snapshot_date'].strip()

          assert s['dshs_unique_current'] - s['dshs_unique_base'] == s['net_unique']
          assert s['base_3107'] + s['net_unique'] == s['current_total']

          groups = {
              'dv': 18,
              'ph': 6,
              'dn': 15,
          }
          for key, expected_len in groups.items():
              rows = data.get(key, [])
              assert len(rows) == expected_len, (key, len(rows), expected_len)
              assert all(set(('code','name','base','delta','current')) <= set(r) for r in rows)
              assert all(r['base'] + r['delta'] == r['current'] for r in rows)
              assert sum(r['base'] for r in rows) == s['base_3107'], key
              assert sum(r['delta'] for r in rows) == s['net_unique'], key
              assert sum(r['current'] for r in rows) == s['current_total'], key
              assert len({r['code'] for r in rows}) == len(rows), key

          assert [r['code'] for r in data['dv']] == [
              'TSDN1','TSDN2','TSDN3','TSKTNV','TSCL','TSĐB1','TSĐB2','TSĐB',
              'TSTB1','TSTB2','TSMT','TSHB','TSCP','TSHN','TSVB','TSHC','TSMC','TSTKV'
          ]
          assert [r['code'] for r in data['ph']] == ['PHHB','PHCP','PHHN','PHVB','PHMC','PHHC']
          assert [r['code'] for r in data['dn']] == [
              'MK','TN','DH','NM','QH','KC','HLONG','HG','UB','XLM','MD','HLẦM','NB','VD','SQ'
          ]

          forbidden = {
              'student_name','full_name','ho_ten','cccd','cmnd','phone','phone_number',
              'mobile','date_of_birth','dob','birth_date','student_id','email'
          }
          def walk(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      assert str(k).lower() not in forbidden
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj: walk(v)
          walk(data)

          print('Admissions unique snapshot validation: PASS')
          print('Snapshot:', data['snapshot_date'])
          print('Manual base 31/7:', s['base_3107'])
          print('DSHS unique 31/7:', s['dshs_unique_base'])
          print('DSHS unique current:', s['dshs_unique_current'])
          print('Net unique:', s['net_unique'])
          print('Official current total:', s['current_total'])
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./tuyen-tho-mo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live admissions JSON
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            live="$(mktemp)"
            if curl --fail --silent --show-error --location --max-time 20 "https://thaylinhtuyenthomo.vn/nhap-hoc/live-report.json?run=${GITHUB_SHA}" -o "$live"; then
              if python - "$live" <<'PY'
          import json, sys
          expected = json.load(open('tuyen-tho-mo/nhap-hoc/live-report.json', encoding='utf-8'))
          actual = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(0 if actual == expected else 1)
          PY
              then
                echo "Live admissions schema-v2 JSON readback: PASS"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Admissions dashboard did not match deployed aggregate in time."
          exit 1