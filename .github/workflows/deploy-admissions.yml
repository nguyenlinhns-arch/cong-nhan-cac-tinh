name: Deploy Admissions Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'tuyen-tho-mo/nhap-hoc/**'
      - '.github/workflows/deploy-admissions.yml'
      - '.github/workflows/verify-nhap-hoc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admissions-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate admissions aggregate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import unicodedata
          from pathlib import Path

          path = Path('tuyen-tho-mo/nhap-hoc/live-report.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          s = data['summary']

          def nfc(value):
              return unicodedata.normalize('NFC', str(value)).strip()

          expected_dv = [
              'Phòng TSDN1', 'Phòng TSDN2', 'Phòng TSDN3', 'Phòng KT-NV',
              'Phòng Chiến Lược', 'Phòng TSĐB1', 'Phòng TSĐB2', 'Phòng TSĐB',
              'Phòng TSTB1', 'Phòng TSTB2', 'Phòng TSMT', 'TS PH Hoành Bồ',
              'TS PH Cẩm Phả', 'TS PH Hữu Nghị', 'TS PH Việt Bắc',
              'TS HTĐT Hồng Cẩm', 'TS PH Móng Cái', 'Trường TKV'
          ]
          expected_ph = [
              'Phân hiệu Hoành Bồ', 'Phân hiệu Cẩm Phả', 'Phân hiệu Hữu Nghị',
              'Phân hiệu Việt Bắc', 'TT HTĐT Hồng Cẩm', 'Phân hiệu Móng Cái'
          ]
          expected_dn = [
              'Mạo Khê', 'Thống Nhất', 'Dương Huy', 'Nam Mẫu', 'Quang Hanh',
              'Khe chàm', 'Hạ long', 'Hòn Gai', 'Uông Bí', 'Xây lắp mỏ',
              'Mông Dương', 'Hà Lầm', 'Núi Béo', 'Vàng Danh',
              'Mỏ tuyển đồng (TCT Khoáng sản)', 'CTY 790', 'CTY 35', 'CTY 45',
              'CTY618', 'CTY91', 'Cty khe sim'
          ]

          assert data.get('schema_version') == 1
          assert isinstance(data.get('snapshot_date'), str) and data['snapshot_date'].strip()

          detail_gap = int(s.get('detail_gap', 0) or 0)
          detail_gap_aug = int(s.get('detail_gap_aug', detail_gap) or 0)
          assert detail_gap >= 0 and detail_gap_aug >= 0
          if detail_gap:
              assert s.get('detail_gap_status') == 'UNALLOCATED'

          monthly_net = sum(s.get(k, 0) for k in ('aug_net', 'sep_net', 'oct_net', 'nov_net', 'dec_net'))
          assert s['base_3107'] + monthly_net == s['system_total']
          assert s['system_total'] - s['deleted'] == s['remaining']
          assert s['system_total'] + s['retakes'] == s['including_retakes']

          b_total = s.get('b_total', 0)
          assert s['system_total'] + b_total == s.get('overall_total')
          assert s['remaining'] + b_total == s.get('overall_remaining')
          assert s['including_retakes'] + b_total == s.get('overall_including_retakes')

          dv = data.get('dv', [])
          dv_extra = data.get('dv_extra', [])
          ph = data.get('ph', [])
          dn = data.get('dn', [])

          assert len(dv) == 18
          assert len(dv_extra) == 18
          assert len(ph) == 6
          assert len(dn) == 21
          assert [nfc(r.get('name', '')) for r in dv] == expected_dv
          assert [nfc(r.get('name', '')) for r in dv_extra] == expected_dv
          assert [nfc(r.get('name', '')) for r in ph] == expected_ph
          assert [nfc(r.get('name', '')) for r in dn] == expected_dn

          assert sum(1 for r in dn if r.get('group') == 'TKV') == 15
          assert sum(1 for r in dn if r.get('group') == 'DONG_BAC') == 6
          assert sum(r.get('current_total', 0) for r in dn if r.get('group') == 'TKV') + detail_gap == s['system_total']
          assert sum(r.get('aug_total', 0) for r in dn if r.get('group') == 'TKV') + detail_gap_aug == s['aug_net']

          for left, right in zip(dv, dv_extra):
              assert nfc(left.get('name', '')) == nfc(right.get('name', ''))
              assert left.get('school_aug', 0) + left.get('company_aug', 0) == left.get('aug_total', 0)
              assert right.get('current_school', 0) + right.get('current_company', 0) == left.get('current_total', 0)

          assert sum(r.get('school_aug', 0) + r.get('company_aug', 0) for r in dv) == s['aug_net']
          assert sum(r.get('current_school', 0) + r.get('current_company', 0) for r in dv_extra) == s['system_total']
          assert sum(r.get('current_total', 0) for r in dv) == s['system_total']
          assert sum(r.get('deleted', 0) for r in dv) == s['deleted']
          assert sum(r.get('remaining', 0) for r in dv) == s['remaining']
          assert sum(r.get('retakes', 0) for r in dv) == s['retakes']
          assert sum(r.get('including_retakes', 0) for r in dv) == s['including_retakes']

          assert all(all(k in r for k in ('month8', 'month9', 'month10', 'month11', 'month12', 'current')) for r in ph)
          assert all(all(len(r[k]) == 12 for k in ('month8', 'month9', 'month10', 'month11', 'month12')) for r in ph)
          assert all(len(r['current']) >= 13 for r in ph)
          assert sum(r['current'][9] for r in ph) + detail_gap == s['system_total']
          assert sum(r['current'][-1] for r in ph) + detail_gap == s['overall_total']
          assert sum(r['month8'][9] for r in ph) + detail_gap_aug == s['aug_net']

          assert all(len(r.get('months', [])) == 12 for r in data.get('tinh', []))
          assert all(len(r.get('months', [])) == 12 for r in data.get('qc', []))

          forbidden = (
              'student_name', 'full_name', 'ho_ten', 'cccd', 'cmnd', 'phone',
              'phone_number', 'mobile', 'date_of_birth', 'dob', 'birth_date',
              'student_id', 'email'
          )
          text = path.read_text(encoding='utf-8').lower()
          assert not any(f'"{k}"' in text for k in forbidden)

          print('Admissions aggregate validation: PASS')
          print('Snapshot:', data.get('snapshot_date'))
          print('A total:', s['system_total'])
          print('Detail gap:', detail_gap)
          print('B total:', b_total)
          print('Overall total:', s['overall_total'])
          print('Monthly net:', monthly_net)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./tuyen-tho-mo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live admissions dashboard
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            live="$(mktemp)"
            page="$(mktemp)"
            if curl --fail --silent --show-error --location --max-time 20 "https://thaylinhtuyenthomo.vn/nhap-hoc/live-report.json?run=${GITHUB_SHA}" -o "$live" \
              && curl --fail --silent --show-error --location --max-time 20 "https://thaylinhtuyenthomo.vn/nhap-hoc/?run=${GITHUB_SHA}" -o "$page"; then
              if python - "$live" <<'PY'
          import json, sys
          expected = json.load(open('tuyen-tho-mo/nhap-hoc/live-report.json', encoding='utf-8'))
          actual = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(0 if actual == expected else 1)
          PY
              then
                echo "Live admissions dashboard exact JSON readback: PASS"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Admissions dashboard did not match deployed aggregate in time."
          exit 1
