name: Normalize recruitment facts 2026

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'operations/**'
      - 'tuyen-tho-mo/**'
      - '.github/workflows/recruitment-facts-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recruitment-facts-normalize
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[facts-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize confirmed recruitment facts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const facts = {
            version: 5,
            confirmed_at: '2026-08-23T10:38:00+07:00',
            status: 'confirmed',
            candidate: {
              gender: 'Nam',
              age_min: 18,
              age_max: 40,
              height_min_cm: 153,
              weight_min_kg: 47,
              health: 'Sức khỏe tốt; kiểm tra mắt, huyết áp, tim mạch và các bệnh ảnh hưởng công việc hầm lò'
            },
            training: {
              khai_thac_mo: '2–3 tháng',
              xay_dung_mo: '2–3 tháng',
              co_dien_mo: '10 tháng'
            },
            study_benefits: {
              tuition: 'Miễn học phí theo chỉ tiêu',
              meals: 'Ăn 3 bữa/ngày',
              accommodation: 'Ở ký túc xá',
              living_support: '7,5 triệu đồng/tháng trong thời gian học'
            },
            after_training: {
              work_location: 'Các đơn vị ngành Than thuộc TKV tại Quảng Ninh',
              income: 'Bình quân 20–25 triệu đồng/tháng',
              income_note: 'Tùy đơn vị, vị trí, ngày công và năng suất',
              employment: 'Có hợp đồng lao động, bảo hiểm, thưởng, xe đưa đón và chế độ theo từng đơn vị'
            },
            contact: {
              brand: 'Thầy Linh – Tuyển Thợ Mỏ',
              phone: '096 304 8585',
              cta: 'Gửi năm sinh – chiều cao/cân nặng – tình trạng sức khỏe để Thầy Linh kiểm tra điều kiện.'
            },
            forbidden_legacy_phrases: [
              '6 triệu',
              '18–25 triệu',
              '7,5 triệu là tổng cả khóa',
              'CAM KẾT THU NHẬP',
              'THU NHẬP CAM KẾT'
            ]
          };

          const exactReplacements = [
            ['7,5 triệu là tổng mức hỗ trợ sinh hoạt trong thời gian học, không phải lương tháng, học phí hoàn lại hay khoản chắc chắn trả một lần.', '7,5 triệu đồng/tháng là mức hỗ trợ sinh hoạt trong thời gian học theo thông tin chuẩn hiện hành; không phải tiền lương sau khi đi làm.'],
            ['7,5 triệu là tổng hỗ trợ sinh hoạt trong thời gian học theo chính sách hiện hành, không phải lương và không phải học phí hoàn lại.', '7,5 triệu đồng/tháng là hỗ trợ sinh hoạt trong thời gian học theo thông tin chuẩn hiện hành, không phải tiền lương sau khi đi làm.'],
            ['<div><dt>Hỗ trợ trong thời gian học</dt><dd>7,5 triệu đồng</dd></div>', '<div><dt>Hỗ trợ trong thời gian học</dt><dd>7,5 triệu đồng/tháng</dd></div>'],
            ['<strong>7,5 triệu</strong>Hỗ trợ trong thời gian học', '<strong>7,5 triệu/tháng</strong>Hỗ trợ trong thời gian học'],
            ['Mức thu nhập được cam kết theo chính sách đang áp dụng.', 'Thu nhập bình quân; tùy đơn vị, vị trí, ngày công và năng suất.'],
            ['lương 25 triệu mỗi tháng khi hoàn thành định mức lao động', 'thu nhập bình quân 20–25 triệu/tháng'],
            ['<article><small>01</small><strong>Miễn học phí</strong><p>Được miễn toàn bộ kinh phí đào tạo theo chương trình.</p></article>', '<article><small>01</small><strong>Miễn học phí</strong><p>Miễn học phí theo chỉ tiêu.</p></article>'],
            ['<article><small>02</small><strong>Ăn, ở miễn phí</strong><p>Ba bữa/ngày, 7 ngày/tuần, mức ăn 90.000 đồng/ngày; ký túc xá khép kín.</p></article>', '<article><small>02</small><strong>Ăn 3 bữa · ở KTX</strong><p>Được bố trí ăn 3 bữa/ngày và ở ký túc xá trong thời gian học.</p></article>'],
            ['<article class="benefit-grid__accent"><small>04</small><strong>85–100% lương khi thực tập</strong><p>So với công nhân trong cùng dây chuyền sản xuất, kèm chế độ theo quy định.</p></article>', '<article class="benefit-grid__accent"><small>04</small><strong>Thực tập sản xuất</strong><p>Được bố trí thực tập theo chương trình; chế độ thực tế theo đơn vị và đợt tiếp nhận.</p></article>'],
            ['<article><small>05</small><strong>Nhận việc sau tốt nghiệp</strong><p>Được doanh nghiệp ký hợp đồng lao động và bố trí đúng nghề đào tạo.</p></article>', '<article><small>05</small><strong>Bố trí việc làm</strong><p>Sau đào tạo được bố trí làm việc tại các đơn vị ngành Than thuộc TKV ở Quảng Ninh.</p></article>'],
            ['<article><small>07</small><strong>8 giờ/ngày, 5 ngày/tuần</strong><p>Lịch làm việc theo phương án sản xuất của doanh nghiệp tiếp nhận.</p></article>', '<article><small>07</small><strong>Hợp đồng & phúc lợi</strong><p>Có hợp đồng lao động, thưởng, xe đưa đón và chế độ theo từng đơn vị.</p></article>']
          ];

          const regexReplacements = [
            [/CAM KẾT THU NHẬP/gu, 'THU NHẬP BÌNH QUÂN'],
            [/THU NHẬP CAM KẾT/gu, 'THU NHẬP BÌNH QUÂN'],
            [/Cam kết thu nhập\s+20[–-]25 triệu(?: đồng)?\/tháng(?: khi hoàn thành định mức lao động)?/giu, 'Thu nhập bình quân 20–25 triệu đồng/tháng, tùy đơn vị, vị trí, ngày công và năng suất'],
            [/Thu nhập\s+20[–-]25 triệu(?: đồng)?\/tháng khi hoàn thành định mức lao động/giu, 'Thu nhập bình quân 20–25 triệu đồng/tháng, tùy đơn vị, vị trí, ngày công và năng suất'],
            [/20[–-]25 triệu\/tháng khi hoàn thành định mức lao động/giu, '20–25 triệu/tháng'],
            [/7,5 triệu đồng\/tháng(?:\/tháng)+/giu, '7,5 triệu đồng/tháng'],
            [/7,5 triệu đồng\/tháng\s+đồng/giu, '7,5 triệu đồng/tháng'],
            [/Hỗ trợ sinh hoạt 7,5 triệu đồng(?!\/tháng)/gu, 'Hỗ trợ 7,5 triệu đồng/tháng'],
            [/hỗ trợ sinh hoạt 7,5 triệu đồng(?!\/tháng)/gu, 'hỗ trợ 7,5 triệu đồng/tháng'],
            [/Hỗ trợ sinh hoạt 7,5 triệu(?!\s+đồng\/tháng)/gu, 'Hỗ trợ 7,5 triệu đồng/tháng'],
            [/hỗ trợ sinh hoạt 7,5 triệu(?!\s+đồng\/tháng)/gu, 'hỗ trợ 7,5 triệu đồng/tháng'],
            [/Hỗ trợ 7,5 triệu đồng(?!\/tháng)/gu, 'Hỗ trợ 7,5 triệu đồng/tháng'],
            [/hỗ trợ 7,5 triệu đồng(?!\/tháng)/gu, 'hỗ trợ 7,5 triệu đồng/tháng'],
            [/Hỗ trợ 7,5 triệu(?!\s+đồng\/tháng)/gu, 'Hỗ trợ 7,5 triệu đồng/tháng'],
            [/hỗ trợ 7,5 triệu(?!\s+đồng\/tháng)/gu, 'hỗ trợ 7,5 triệu đồng/tháng'],
            [/7,5 triệu sinh hoạt phí/giu, '7,5 triệu đồng/tháng hỗ trợ sinh hoạt']
          ];

          const canonicalFactsPath = path.normalize('content/recruitment-facts-2026.json');
          const publicFactsPath = path.normalize(path.join('tuyen-tho-mo', 'data', 'recruitment-facts-2026.json'));
          const roots = ['content', 'tools', 'operations', 'tuyen-tho-mo'];
          const allowed = new Set(['.html', '.js', '.mjs', '.json', '.md', '.txt', '.xml']);
          let changedFiles = 0;

          function normalizeText(text) {
            let next = text;
            for (const [from, to] of exactReplacements) next = next.split(from).join(to);
            for (const [pattern, to] of regexReplacements) next = next.replace(pattern, to);
            return next;
          }

          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (allowed.has(path.extname(entry.name).toLowerCase())) normalizeFile(p);
            }
          }

          function normalizeFile(file) {
            const normalized = path.normalize(file);
            if (normalized === canonicalFactsPath || normalized === publicFactsPath) return;
            let text;
            try { text = fs.readFileSync(file, 'utf8'); } catch { return; }
            const next = normalizeText(text);
            if (next !== text) {
              fs.writeFileSync(file, next);
              changedFiles += 1;
            }
          }

          for (const root of roots) walk(root);

          const masterPath = 'operations/job-posting-master-2026.json';
          if (fs.existsSync(masterPath)) {
            const master = JSON.parse(fs.readFileSync(masterPath, 'utf8'));
            master.version = Math.max(Number(master.version || 0), 9);
            master.updated_at = '2026-08-23T10:38:00+07:00';
            master.income_commitment = 'Thu nhập bình quân 20–25 triệu đồng/tháng, tùy đơn vị, vị trí, ngày công và năng suất';
            master.income_reference = master.income_commitment;
            if (Array.isArray(master.benefits)) {
              master.benefits = master.benefits.map(item => /Hỗ trợ\s+7,5\s+triệu/i.test(item)
                ? 'Hỗ trợ 7,5 triệu đồng/tháng trong thời gian học theo chính sách đợt tuyển'
                : item);
            }
            master.canonical_facts = 'content/recruitment-facts-2026.json';
            fs.writeFileSync(masterPath, JSON.stringify(master, null, 2) + '\n');
          }

          fs.mkdirSync('content', {recursive: true});
          fs.writeFileSync(canonicalFactsPath, JSON.stringify(facts, null, 2) + '\n');
          fs.mkdirSync(path.join('tuyen-tho-mo', 'data'), {recursive: true});
          fs.writeFileSync(publicFactsPath, JSON.stringify(facts, null, 2) + '\n');
          console.log(JSON.stringify({facts: canonicalFactsPath, publicFacts: publicFactsPath, changedFiles}, null, 2));
          NODE

      - name: Verify canonical facts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const facts = JSON.parse(fs.readFileSync('content/recruitment-facts-2026.json','utf8'));
          if (facts.study_benefits.living_support !== '7,5 triệu đồng/tháng trong thời gian học') process.exit(1);
          if (facts.after_training.income !== 'Bình quân 20–25 triệu đồng/tháng') process.exit(1);
          const publicFacts = JSON.parse(fs.readFileSync('tuyen-tho-mo/data/recruitment-facts-2026.json','utf8'));
          if (JSON.stringify(publicFacts) !== JSON.stringify(facts)) process.exit(1);
          const current = JSON.parse(fs.readFileSync('tuyen-tho-mo/recruitment-current.json','utf8'));
          if (current.benefits_during_training?.living_support !== '7,5 triệu đồng/tháng trong thời gian học') process.exit(1);
          if (!String(current.after_training?.income_reference || current.after_training?.income_commitment || '').includes('20–25 triệu đồng/tháng')) process.exit(1);
          const master = JSON.parse(fs.readFileSync('operations/job-posting-master-2026.json','utf8'));
          if (!master.income_reference.includes('20–25 triệu đồng/tháng')) process.exit(1);
          if (!master.benefits.some(x => x.includes('7,5 triệu đồng/tháng'))) process.exit(1);

          const home = fs.readFileSync('tuyen-tho-mo/index.html','utf8');
          const job = fs.readFileSync('tuyen-tho-mo/viec-lam/cong-nhan-mo-ham-lo-quang-ninh/index.html','utf8');
          const paid = fs.readFileSync('tuyen-tho-mo/tuyen-tho-mo-quang-ninh/index.html','utf8');
          const critical = [home, job, paid].join('\n');
          if (/CAM KẾT THU NHẬP|THU NHẬP CAM KẾT|Cam kết thu nhập/iu.test(critical)) process.exit(1);
          if (/7,5 triệu đồng\/tháng(?:\/tháng|\s+đồng)/iu.test(critical)) process.exit(1);
          if (/20[–-]25 triệu(?: đồng)?\/tháng khi hoàn thành định mức lao động/iu.test(critical)) process.exit(1);
          if (!home.includes('Hỗ trợ 7,5 triệu đồng/tháng')) process.exit(1);
          if (!job.includes('<dt>Hỗ trợ trong thời gian học</dt><dd>7,5 triệu đồng/tháng</dd>')) process.exit(1);
          if (!paid.includes('<strong>7,5 triệu/tháng</strong>Hỗ trợ trong thời gian học')) process.exit(1);
          if (job.includes('Mức thu nhập được cam kết theo chính sách đang áp dụng.')) process.exit(1);
          if (job.includes('85–100% lương khi thực tập')) process.exit(1);
          if (job.includes('8 giờ/ngày, 5 ngày/tuần')) process.exit(1);
          console.log('Canonical recruitment facts verified.');
          NODE

      - name: Commit normalized facts
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'thaylinh-marketing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content tools operations tuyen-tho-mo
          git commit -m 'chore: sync confirmed recruitment facts [facts-sync]'
          git push
