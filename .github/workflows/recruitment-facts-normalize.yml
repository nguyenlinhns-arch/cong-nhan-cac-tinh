name: Normalize recruitment facts 2026

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'operations/**'
      - 'tuyen-tho-mo/**'
      - '.github/workflows/recruitment-facts-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recruitment-facts-normalize
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[facts-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce confirmed recruitment facts
        run: node tools/enforce-confirmed-recruitment-facts.mjs

      - name: Commit normalized facts
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'thaylinh-marketing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content tools operations tuyen-tho-mo
          git commit -m 'chore: sync confirmed recruitment facts [facts-sync]'
          git push
