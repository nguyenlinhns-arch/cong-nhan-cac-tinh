name: Verify live admissions dashboard

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-live-nhap-hoc
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify /nhap-hoc live matches every report component
        shell: bash
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/nhap-hoc
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          live_index="$(mktemp)"
          live_app="$(mktemp)"
          live_report="$(mktemp)"
          expected_report="$(mktemp)"
          actual_report="$(mktemp)"

          jq -S . tuyen-tho-mo/nhap-hoc/live-report.json > "$expected_report"

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/?run=${DEPLOY_SHA}" -o "$live_index" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/app.js?run=${DEPLOY_SHA}" -o "$live_app" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/live-report.json?run=${DEPLOY_SHA}" -o "$live_report" \
              && jq -S . "$live_report" > "$actual_report"; then

              if cmp -s tuyen-tho-mo/nhap-hoc/index.html "$live_index" \
                && cmp -s tuyen-tho-mo/nhap-hoc/app.js "$live_app" \
                && cmp -s "$expected_report" "$actual_report" \
                && jq -e '
                  def nz: . // 0;
                  def trimmed: gsub("^\\s+|\\s+$"; "");
                  def reqkeys: [
                    "hsc_aug","lt_aug","xsc_aug","vht_aug","electric_aug",
                    "school_aug","company_aug","aug_total","tckt_aug","sckt_aug",
                    "db_electric_aug","east_aug","b_aug","current_total","deleted",
                    "remaining","plan","pct","retakes","including_retakes"
                  ];
                  .schema_version == 1
                  and (.snapshot_date | type == "string" and length > 0)
                  and (.summary.base_3107 + .summary.aug_net == .summary.system_total)
                  and (.summary.system_total - .summary.deleted == .summary.remaining)
                  and (.summary.system_total + .summary.retakes == .summary.including_retakes)
                  and ((.dv|type)=="array" and (.dv|length)==18)
                  and ((.dv_extra|type)=="array" and (.dv_extra|length)==(.dv|length))
                  and ((.ph|type)=="array" and (.ph|length)>0)
                  and ((.dn|type)=="array" and (.dn|length)>0)
                  and ((.tinh|type)=="array")
                  and ((.qc|type)=="array")
                  and ([.dv[] | (reqkeys - (keys_unsorted)) | length == 0] | all)
                  and ([range(0; .dv|length) as $i |
                        ((.dv[$i].name|trimmed) == (.dv_extra[$i].name|trimmed))
                        and ((.dv[$i].school_aug|nz) + (.dv[$i].company_aug|nz) == (.dv[$i].aug_total|nz))
                        and ((.dv_extra[$i].current_school|nz) + (.dv_extra[$i].current_company|nz) == (.dv[$i].current_total|nz))
                      ] | all)
                  and (([.dv[].school_aug]|add) + ([.dv[].company_aug]|add) == .summary.aug_net)
                  and (([.dv_extra[].current_school]|add) + ([.dv_extra[].current_company]|add) == .summary.system_total)
                  and ([.dv[].current_total]|add == .summary.system_total)
                  and ([.dv[].deleted]|add == .summary.deleted)
                  and ([.dv[].remaining]|add == .summary.remaining)
                  and ([.dv[].retakes]|add == .summary.retakes)
                  and ([.dv[].including_retakes]|add == .summary.including_retakes)
                  and ([.ph[].current[9]]|add == .summary.system_total)
                  and ([.dn[].current_total]|add == .summary.system_total)
                  and (([paths(scalars) as $p | ($p[-1]|tostring|ascii_downcase)] |
                         map(select(test("student_name|full_name|ho_ten|cccd|cmnd|phone|phone_number|mobile|date_of_birth|dob|birth_date|student_id|email"))) |
                         length) == 0)
                ' "$live_report" >/dev/null; then
                  echo "Admissions dashboard column-by-column readback PASS on attempt ${attempt}."
                  echo "Deployed SHA: ${DEPLOY_SHA}"
                  echo "Snapshot: $(jq -r '.snapshot_date' "$live_report")"
                  echo "T8 school/company/net: $(jq -r '([.dv[].school_aug]|add|tostring) + "/" + ([.dv[].company_aug]|add|tostring) + "/" + (.summary.aug_net|tostring)' "$live_report")"
                  echo "Current school/company/total: $(jq -r '([.dv_extra[].current_school]|add|tostring) + "/" + ([.dv_extra[].current_company]|add|tostring) + "/" + (.summary.system_total|tostring)' "$live_report")"
                  echo "Deleted/remaining/retakes/incl: $(jq -r '(.summary.deleted|tostring) + "/" + (.summary.remaining|tostring) + "/" + (.summary.retakes|tostring) + "/" + (.summary.including_retakes|tostring)' "$live_report")"
                  exit 0
              fi
            fi

            echo "Admissions dashboard not fully updated yet (attempt ${attempt}/36)."
            sleep 10
          done

          echo "ERROR: /nhap-hoc did not match deployed report column by column for ${DEPLOY_SHA}."
          exit 1
