name: Verify live admissions dashboard

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-live-nhap-hoc
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify /nhap-hoc live matches deployed aggregate
        shell: bash
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/nhap-hoc
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          live_index="$(mktemp)"
          live_app="$(mktemp)"
          live_report="$(mktemp)"
          expected_report="$(mktemp)"
          actual_report="$(mktemp)"

          jq -S . tuyen-tho-mo/nhap-hoc/live-report.json > "$expected_report"

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/?run=${DEPLOY_SHA}" -o "$live_index" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/app.js?run=${DEPLOY_SHA}" -o "$live_app" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/live-report.json?run=${DEPLOY_SHA}" -o "$live_report" \
              && jq -S . "$live_report" > "$actual_report"; then

              if cmp -s tuyen-tho-mo/nhap-hoc/index.html "$live_index" \
                && cmp -s tuyen-tho-mo/nhap-hoc/app.js "$live_app" \
                && cmp -s "$expected_report" "$actual_report" \
                && [ "$(jq -r '.schema_version' "$live_report")" = "1" ] \
                && [ "$(jq -r '.summary.base_3107 + .summary.aug_net == .summary.system_total' "$live_report")" = "true" ] \
                && [ "$(jq -r '.summary.system_total - .summary.deleted == .summary.remaining' "$live_report")" = "true" ] \
                && [ "$(jq -r '.summary.system_total + .summary.retakes == .summary.including_retakes' "$live_report")" = "true" ]; then
                  echo "Admissions dashboard live readback PASS on attempt ${attempt}."
                  echo "Deployed SHA: ${DEPLOY_SHA}"
                  echo "Snapshot: $(jq -r '.snapshot_date' "$live_report")"
                  echo "Official total: $(jq -r '.summary.system_total' "$live_report")"
                  echo "Today: $(jq -r '.summary.today_count' "$live_report")"
                  exit 0
              fi
            fi

            echo "Admissions dashboard not fully updated yet (attempt ${attempt}/36)."
            sleep 10
          done

          echo "ERROR: /nhap-hoc did not match deployed live aggregate for ${DEPLOY_SHA}."
          exit 1
