name: Verify live admissions dashboard

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages", "Deploy Admissions Dashboard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-live-nhap-hoc
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify /nhap-hoc live unique snapshot
        shell: bash
        env:
          LIVE_URL: https://thaylinhtuyenthomo.vn/nhap-hoc
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          live_index="$(mktemp)"
          live_app="$(mktemp)"
          live_loader="$(mktemp)"
          live_report="$(mktemp)"
          expected_report="$(mktemp)"
          actual_report="$(mktemp)"
          jq -S . tuyen-tho-mo/nhap-hoc/live-report.json > "$expected_report"

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/?run=${DEPLOY_SHA}" -o "$live_index" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/app.js?run=${DEPLOY_SHA}" -o "$live_app" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/report-loader.js?run=${DEPLOY_SHA}" -o "$live_loader" \
              && curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}/live-report.json?run=${DEPLOY_SHA}" -o "$live_report" \
              && jq -S . "$live_report" > "$actual_report"; then

              if cmp -s tuyen-tho-mo/nhap-hoc/index.html "$live_index" \
                && cmp -s tuyen-tho-mo/nhap-hoc/app.js "$live_app" \
                && cmp -s tuyen-tho-mo/nhap-hoc/report-loader.js "$live_loader" \
                && cmp -s "$expected_report" "$actual_report"; then

                python - "$live_report" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          s = data['summary']
          assert data['schema_version'] == 2
          assert data['method'] == 'BASE_3107_PLUS_UNIQUE_DSHS_DELTA'
          assert s['dshs_unique_current'] - s['dshs_unique_base'] == s['net_unique']
          assert s['base_3107'] + s['net_unique'] == s['current_total']
          for key, count in [('dv',18),('ph',6),('dn',15)]:
              rows = data[key]
              assert len(rows) == count
              assert all(r['base'] + r['delta'] == r['current'] for r in rows)
              assert sum(r['base'] for r in rows) == s['base_3107']
              assert sum(r['delta'] for r in rows) == s['net_unique']
              assert sum(r['current'] for r in rows) == s['current_total']
          PY

                echo "Admissions dashboard schema-v2 readback PASS on attempt ${attempt}."
                echo "Deployed SHA: ${DEPLOY_SHA}"
                echo "Snapshot: $(jq -r '.snapshot_date' "$live_report")"
                echo "Manual base / unique base / unique current / net / current: $(jq -r '[.summary.base_3107,.summary.dshs_unique_base,.summary.dshs_unique_current,.summary.net_unique,.summary.current_total] | map(tostring) | join("/")' "$live_report")"
                exit 0
              fi
            fi
            echo "Admissions dashboard not fully updated yet (attempt ${attempt}/36)."
            sleep 10
          done

          echo "ERROR: /nhap-hoc did not match deployed schema-v2 report for ${DEPLOY_SHA}."
          exit 1