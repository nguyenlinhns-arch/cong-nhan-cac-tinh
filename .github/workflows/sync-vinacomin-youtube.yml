name: Sync official Vinacomin YouTube videos

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vinacomin-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the official channel feed
        run: node tools/sync-vinacomin-youtube.mjs
      - name: Rebuild search and validate the website
        run: |
          node tools/generate-legacy-redirects.mjs
          node tools/generate-news-sitemap.mjs
          node tools/build-search-index.mjs
          node tools/enhance-all-province-search.mjs
          node tools/normalize-mobile-delivery.mjs
          node tools/validate-modular-delivery.mjs
          node tools/validate-content-network.mjs
          node tools/audit-technical-seo.mjs
          node tools/validate-performance-budget.mjs
          node tools/validate-video-proof-library.mjs
          node tools/validate-workflow-safety.mjs
          node tools/validate-ai-search.mjs
          node tools/validate-search-intents.mjs
      - name: Publish new video metadata when the channel changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No new public videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuyen-tho-mo/data/vinacomin-youtube.json tuyen-tho-mo/video-tkv/index.html tuyen-tho-mo/anh-video-thuc-te/index.html tuyen-tho-mo/sitemap.xml tuyen-tho-mo/search-index.json tuyen-tho-mo/search-core.json tuyen-tho-mo/search-provinces.json tuyen-tho-mo/search-content.json
          git commit -m "content: sync official TKV YouTube videos"
          git push origin HEAD:main
