name: Verify Thay Linh GitHub Pages trial

on:
  push:
    branches:
      - main
    paths:
      - '.pages-check-trigger'
      - '.github/workflows/verify-thay-linh-pages.yml'

permissions:
  contents: write

concurrency:
  group: verify-thay-linh-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'trigger: verify Thầy Linh Pages')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public GitHub Pages URLs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nguyenlinhns-arch.github.io/cong-nhan-cac-tinh'

          fetch_until_ready() {
            local url="$1"
            local output="$2"
            local expected="$3"
            local code=''
            for attempt in $(seq 1 48); do
              code=$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' --max-time 25 "$url" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$expected" "$output"; then
                printf '%s\n' "$code"
                return 0
              fi
              echo "Attempt ${attempt}: ${url} returned ${code}; waiting for Pages deployment"
              sleep 5
            done
            echo "Public verification failed for ${url}; last HTTP status: ${code}" >&2
            test -f "$output" && head -80 "$output" >&2 || true
            return 1
          }

          HOME_CODE=$(fetch_until_ready "$BASE/tuyen-tho-mo/" /tmp/thay-linh-home.html 'Thầy Linh – Tuyển Thợ Mỏ')
          PROVINCE_CODE=$(fetch_until_ready "$BASE/tuyen-tho-mo/viec-lam-nganh-than/gia-lai/" /tmp/thay-linh-gia-lai.html 'Gia Lai')
          ROOT_CODE=$(fetch_until_ready "$BASE/" /tmp/existing-root.html 'Công nhân Thanh Hóa trong ngành Than')

          grep -Fq 'https://zalo.me/0963048585' /tmp/thay-linh-home.html
          grep -Fq 'https://m.me/thaylinhtuyenthomo' /tmp/thay-linh-home.html
          grep -Fq 'Tôi là ai' /tmp/thay-linh-home.html
          grep -Fq 'làm việc tại Quảng Ninh' /tmp/thay-linh-gia-lai.html

          ASSET_CODE=$(curl --location --silent --show-error --output /tmp/og-cover.png --write-out '%{http_code}' --max-time 25 "$BASE/tuyen-tho-mo/assets/og-cover.png")
          test "$ASSET_CODE" = '200'
          test -s /tmp/og-cover.png

          cat > /tmp/PAGES_VERIFICATION_RECEIPT.md <<EOF
          # GitHub Pages verification receipt

          - Website: Thầy Linh – Tuyển Thợ Mỏ
          - Home URL: $BASE/tuyen-tho-mo/
          - Home HTTP: $HOME_CODE
          - Province URL: $BASE/tuyen-tho-mo/viec-lam-nganh-than/gia-lai/
          - Province HTTP: $PROVINCE_CODE
          - Existing root URL: $BASE/
          - Existing root HTTP: $ROOT_CODE
          - OG image HTTP: $ASSET_CODE
          - Zalo CTA: VERIFIED
          - Messenger CTA: VERIFIED
          - “Tôi là ai”: VERIFIED
          - Existing root website: VERIFIED
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Verified at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Store receipt and remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/PAGES_VERIFICATION_RECEIPT.md tuyen-tho-mo/PAGES_VERIFICATION_RECEIPT.md
          rm -f .pages-check-trigger
          rm -f .github/workflows/verify-thay-linh-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: verify Thầy Linh Pages trial [skip ci]'
          git push origin HEAD:main
