name: Submit changed URLs to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'tuyen-tho-mo/**'

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build changed URL list
        id: urls
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          base = 'https://thaylinhtuyenthomo.vn'
          changed = subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'], text=True).splitlines()
          urls = set()
          for p in changed:
              if not p.startswith('tuyen-tho-mo/'):
                  continue
              rel = p[len('tuyen-tho-mo/'):]
              if rel.endswith('/index.html'):
                  path = '/' + rel[:-len('index.html')]
                  urls.add(base + path)
              elif rel == 'index.html':
                  urls.add(base + '/')

          signals = set(changed)
          if any(p.endswith('google-search-intent.js') or p.endswith('recruitment-current.json') or p.endswith('recruitment-config.js') for p in signals):
              urls.add(base + '/viec-lam/cong-nhan-mo-ham-lo-quang-ninh/')
              urls.add(base + '/thong-tin-tuyen-tho-mo/')
          if any(p.endswith('worker-questions.json') or p.endswith('daily-seo-articles.json') or 'giai-dap-nghe-mo/' in p for p in signals):
              urls.add(base + '/giai-dap-nghe-mo/')

          urls = sorted(urls)
          with open('/tmp/indexnow-urls.json','w',encoding='utf-8') as f:
              json.dump(urls, f, ensure_ascii=False)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('count=%d\n' % len(urls))
          print('\n'.join(urls) if urls else 'No indexable URL changed')
          PY

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/indexnow-payload.json
          import json
          with open('/tmp/indexnow-urls.json', encoding='utf-8') as f:
              urls = json.load(f)
          payload = {
              'host': 'thaylinhtuyenthomo.vn',
              'key': 'tl-20260809-8f4c2d6a7b9e3c1d',
              'keyLocation': 'https://thaylinhtuyenthomo.vn/tl-20260809-8f4c2d6a7b9e3c1d.txt',
              'urlList': urls[:10000]
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY
          curl --fail-with-body --retry 2 --retry-delay 3 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json \
            https://api.indexnow.org/indexnow
