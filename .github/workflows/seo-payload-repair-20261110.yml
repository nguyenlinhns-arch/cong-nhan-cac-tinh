name: Repair SEO payload 2026-11-10
on:
  push:
    paths:
      - '.github/workflows/seo-payload-repair-20261110.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore verified SEO JSON
        env:
          PATCH_B64: >-
            
        run: |
          git show fbfe662b8c8a5b504e40ecf30002b50fc7b61b14:content/daily-seo-articles.json > content/daily-seo-articles.json
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d | git apply -
          echo '2344741fd06f17c88e396d356c3e8736ba9d55dfa0add2159fd51941bb1c7e1f  content/daily-seo-articles.json' | sha256sum -c -
          node -e "JSON.parse(require('fs').readFileSync('content/daily-seo-articles.json','utf8'))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/seo-payload-repair-20261110.yml'
          git add content/daily-seo-articles.json
          git commit -m 'Sửa payload dữ liệu SEO ngày 2026-11-13'
          git push origin HEAD:main
