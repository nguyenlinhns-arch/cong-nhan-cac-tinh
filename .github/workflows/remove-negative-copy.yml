name: Remove negative copy from recruitment website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-negative-copy.yml'

permissions:
  contents: write

concurrency:
  group: remove-negative-copy
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite visible copy positively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('tuyen-tho-mo')
          files = [p for p in root.rglob('*') if p.suffix in {'.html', '.js', '.css', '.txt'}]

          replacements = {
            # phone display only
            '0963 048 585': '096 304 8585',
            'nhắn Zalo 0963048585': 'nhắn Zalo 096 304 8585',
            'Zalo 0963048585': 'Zalo 096 304 8585',

            # hero / disclaimers / negative UI copy
            '<p class="safe-note">Không hứa chắc trúng tuyển, không cam kết lương cố định, không nói việc nhẹ. Tư vấn đúng điều kiện, đúng quy trình, rõ nơi học và nơi làm việc.</p>': '<p class="safe-note">Tư vấn đúng điều kiện, đúng quy trình, rõ nơi học và nơi làm việc.</p>',
            '<article><b>Không cam kết quá mức</b><p>Thu nhập chỉ là tham khảo; kết quả còn phụ thuộc sức khỏe, đào tạo, đơn vị và từng đợt tiếp nhận.</p></article>': '<article><b>Điều kiện được kiểm tra trước</b><p>Thông tin về thu nhập, đào tạo và đơn vị tiếp nhận được tư vấn rõ theo từng trường hợp.</p></article>',
            '<h3>Thu nhập thợ lò là mức tham khảo, không phải cam kết cố định.</h3>': '<h3>Tìm hiểu thu nhập và đời sống thợ lò.</h3>',
            '<p>Thu nhập phụ thuộc vị trí, ngày công, năng suất và từng đơn vị. Website dùng ví dụ thực tế để người lao động tham khảo, không hứa chắc mức lương hoặc việc nhẹ.</p>': '<p>Thu nhập thực tế phụ thuộc vị trí, ngày công, năng suất và từng đơn vị. Thầy Linh sẽ tư vấn để người lao động hiểu rõ trước khi đăng ký.</p>',
            '<p class="disclaimer">Đây là kênh thông tin và tư vấn cá nhân của Nguyễn Tử Linh, không phải cổng thông tin điện tử chính thức của TKV hoặc Nhà trường.</p>': '<p class="disclaimer">Thầy Linh trực tiếp tư vấn điều kiện, hướng dẫn hồ sơ và đồng hành cùng người lao động trong quá trình tìm hiểu nghề mỏ.</p>',
            '<h2 id="lead-card-title">Em muốn kiểm tra điều kiện học nghề mỏ</h2>': '<h2 id="lead-card-title">Bạn muốn kiểm tra điều kiện học nghề mỏ?</h2>',
            '<button class="copy-template" type="button" data-copy-template>Sao chép mẫu tin nhắn</button>': '<a class="copy-template" href="https://zalo.me/0963048585" target="_blank" rel="noopener" data-contact="zalo">Gửi thông tin để được tư vấn</a>',

            # source/news page phrasing
            'Mỗi nội dung chỉ tóm tắt và dẫn link gốc; không sao chép bài báo, không bịa số liệu và không biến thông tin tham khảo thành cam kết tuyển dụng.': 'Mỗi nội dung được tóm tắt ngắn gọn, dẫn link gốc để người lao động dễ đối chiếu và hiểu đúng thông tin tuyển sinh.',
            'không sao chép bài báo, không bịa số liệu': 'tôn trọng nguồn gốc và đối chiếu số liệu theo bài gốc',
            'không biến thông tin tham khảo thành cam kết tuyển dụng': 'trình bày thông tin tham khảo theo đúng nguồn',

            # article phrasing
            'không phải cam kết cố định': 'là thông tin tham khảo theo từng vị trí và đơn vị',
            'không phải một con số cố định': 'có thể khác nhau theo từng người, từng đơn vị và từng tháng',
            'không cam kết lương cố định': 'tư vấn thu nhập theo từng vị trí và đơn vị',
            'không cam kết chắc chắn trúng tuyển': 'điều kiện chính thức sẽ được kiểm tra trước khi nhập học',
            'không hứa chắc chắn': 'tư vấn theo điều kiện thực tế',
            'không hứa chắc mức lương hoặc việc nhẹ': 'giúp người lao động hiểu rõ công việc và thu nhập trước khi đăng ký',
            'không hứa việc nhẹ': 'tư vấn rõ đặc thù công việc',
            'không hứa chắc lương hoặc trúng tuyển': 'thông tin được tư vấn theo từng đợt tiếp nhận',
            'Không. Thu nhập phụ thuộc vị trí, ngày công, năng suất và đơn vị. Website chỉ cung cấp thông tin tham khảo, không cam kết mức lương cố định.': 'Thu nhập thực tế phụ thuộc vị trí, ngày công, năng suất và đơn vị. Website cung cấp thông tin để người lao động tham khảo trước khi đăng ký.',
            'Không. Thu nhập chỉ là mức tham khảo, phụ thuộc vị trí, ngày công, năng suất và từng đơn vị.': 'Thu nhập thực tế phụ thuộc vị trí, ngày công, năng suất và từng đơn vị.',
            'không dùng như cam kết thu nhập cố định': 'là câu chuyện tiêu biểu để tham khảo',
            'không yêu cầu chuẩn bị hồ sơ trước khi kiểm tra điều kiện': 'kiểm tra điều kiện trước rồi mới chuẩn bị hồ sơ',
            'Không yêu cầu làm hồ sơ ngay. ': '',
            'Chưa cần. Hãy gửi ba thông tin cơ bản trước để được kiểm tra điều kiện.': 'Hãy gửi ba thông tin cơ bản để được kiểm tra điều kiện trước khi chuẩn bị hồ sơ.',
            'Chưa cần vội chuẩn bị. Hãy gửi': 'Hãy gửi',

            # identity line
            'không phải cổng thông tin điện tử chính thức của TKV hoặc Nhà trường': 'là kênh tư vấn trực tiếp giúp người lao động tìm hiểu nghề mỏ rõ ràng hơn',
            'Đây là kênh thông tin và tư vấn cá nhân của Nguyễn Tử Linh, là kênh tư vấn trực tiếp giúp người lao động tìm hiểu nghề mỏ rõ ràng hơn.': 'Thầy Linh trực tiếp tư vấn điều kiện, hướng dẫn hồ sơ và đồng hành cùng người lao động trong quá trình tìm hiểu nghề mỏ.',
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              # clean CSS hack now that direct content/action is fixed
              text = text.replace('#lead-card-title{font-size:0!important;line-height:0!important}#lead-card-title::before{content:"Bạn muốn kiểm tra điều kiện học nghề mỏ?";display:block;font-size:26px;line-height:1.14;color:var(--coal)}.copy-template{font-size:0!important}.copy-template::before{content:"Gửi thông tin để được tư vấn";font-size:15px;line-height:1;color:#fff;font-weight:950}\n', '')
              # ensure copy-template anchors look like centered buttons too
              text = text.replace('.copy-template{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:950}', '.copy-template{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:950;display:flex;align-items:center;justify-content:center;text-align:center}')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          bad_terms = [
              'Không hứa', 'không hứa', 'không cam kết', 'không phải cổng', 'không nói việc nhẹ',
              'lương cố định', 'cam kết cố định', 'không phải cam kết', 'không dùng như cam kết',
              'không sao chép', 'không bịa', 'không biến thông tin tham khảo'
          ]
          hits = []
          for path in files:
              if path.suffix not in {'.html', '.js', '.css', '.txt'}:
                  continue
              text = path.read_text(encoding='utf-8')
              for term in bad_terms:
                  if term in text:
                      hits.append((str(path), term))
          if hits:
              for p, term in hits:
                  print(f'BAD_TERM {term!r} in {p}')
              raise SystemExit(1)
          PY

      - name: Commit cleaned copy and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-negative-copy.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'polish: remove negative disclaimers from recruitment website'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
