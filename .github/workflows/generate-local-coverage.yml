name: Generate local coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - 'tuyen-tho-mo/scripts/generate-local-coverage.mjs'
      - 'tuyen-tho-mo/scripts/enhance-local-coverage.mjs'
      - 'tuyen-tho-mo/scripts/enrich-local-worker-history.mjs'
      - 'tuyen-tho-mo/scripts/normalize-local-page-delivery.mjs'
      - 'tuyen-tho-mo/scripts/build-locality-feed.mjs'
      - 'tuyen-tho-mo/scripts/update-ai-locality-discovery.mjs'
      - 'tuyen-tho-mo/scripts/audit-local-coverage.mjs'
      - 'tuyen-tho-mo/scripts/link-province-commune-hubs.mjs'
      - 'tuyen-tho-mo/data/historical-workers-by-commune-*.json'
      - 'tuyen-tho-mo/recruitment-current.json'
      - '.github/workflows/generate-local-coverage.yml'
  pull_request:
    paths:
      - 'tuyen-tho-mo/scripts/materialize-local-coverage.trigger'
      - 'tuyen-tho-mo/scripts/generate-local-coverage.mjs'
      - 'tuyen-tho-mo/scripts/enhance-local-coverage.mjs'
      - 'tuyen-tho-mo/scripts/enrich-local-worker-history.mjs'
      - 'tuyen-tho-mo/scripts/normalize-local-page-delivery.mjs'
      - 'tuyen-tho-mo/scripts/build-locality-feed.mjs'
      - 'tuyen-tho-mo/scripts/update-ai-locality-discovery.mjs'
      - 'tuyen-tho-mo/scripts/audit-local-coverage.mjs'
      - 'tuyen-tho-mo/scripts/link-province-commune-hubs.mjs'
      - 'tuyen-tho-mo/data/historical-workers-by-commune-*.json'
      - 'tuyen-tho-mo/recruitment-current.json'

permissions:
  contents: write

concurrency:
  group: generate-local-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate all current commune, ward and special-zone pages
        run: node tuyen-tho-mo/scripts/generate-local-coverage.mjs
      - name: Link every province page to its commune directory
        run: node tuyen-tho-mo/scripts/link-province-commune-hubs.mjs
      - name: Add useful recruitment content to every locality page
        run: node tuyen-tho-mo/scripts/enhance-local-coverage.mjs
      - name: Add privacy-safe historical recruitment evidence by commune
        run: node tuyen-tho-mo/scripts/enrich-local-worker-history.mjs
      - name: Normalize mobile analytics and social delivery
        run: node tuyen-tho-mo/scripts/normalize-local-page-delivery.mjs
      - name: Build machine-readable locality feed
        run: node tuyen-tho-mo/scripts/build-locality-feed.mjs
      - name: Update AI and crawler locality discovery
        run: node tuyen-tho-mo/scripts/update-ai-locality-discovery.mjs
      - name: Audit every generated locality page and evidence privacy
        run: node tuyen-tho-mo/scripts/audit-local-coverage.mjs
      - name: Validate crawler discovery files
        run: |
          grep -q 'commune-sitemap.xml' tuyen-tho-mo/robots.txt
          grep -q 'jobs-sitemap.xml' tuyen-tho-mo/robots.txt
          grep -q 'province-sitemap.xml' tuyen-tho-mo/robots.txt
          grep -q 'localities.json' tuyen-tho-mo/robots.txt
          grep -q 'localities.json' tuyen-tho-mo/llms.txt
      - name: Commit generated coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuyen-tho-mo/viec-lam-nganh-than tuyen-tho-mo/commune-sitemap.xml tuyen-tho-mo/local-coverage.json tuyen-tho-mo/local-evidence-report.json tuyen-tho-mo/localities.json tuyen-tho-mo/robots.txt tuyen-tho-mo/llms.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cập nhật đủ 3.321 địa bàn và bằng chứng địa phương [skip ci]'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git push origin "HEAD:${TARGET_BRANCH}"
