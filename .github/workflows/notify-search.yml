name: Notify search engines after deployment

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-search
  cancel-in-progress: true

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Collect changed public files
        id: changes
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
          else
            git show --pretty='' --name-only HEAD > changed-files.txt
          fi
          echo "Changed files:"
          cat changed-files.txt

      - name: Submit changed URLs through IndexNow
        continue-on-error: true
        shell: bash
        run: |
          changed_files="$(cat changed-files.txt)"
          INDEXNOW_CHANGED_FILES="$changed_files" node tools/submit-indexnow.mjs

      - name: Refresh Google Search Console sitemaps
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            node tools/submit-google-sitemap.mjs
          else
            echo "Google sitemap submission skipped because the Search Console credential is not configured."
          fi
